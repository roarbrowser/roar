<svg xmlns="http://www.w3.org/2000/svg" viewBox="182 196 660 664">
  <!-- Roar app icon: a proud lion mid-roar with a petal mane, on a cream tile. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6EA"/>
      <stop offset="1" stop-color="#FFE2B8"/>
    </linearGradient>
  </defs>
  <g transform="translate(152 140) scale(7.2)">
    <!-- Mane: ten alternating petals -->
    <circle cx="50.00" cy="23.00" r="15" fill="#FF7A00"/><circle cx="68.22" cy="28.92" r="15" fill="#FF9A2E"/><circle cx="79.48" cy="44.42" r="15" fill="#FF7A00"/><circle cx="79.48" cy="63.58" r="15" fill="#FF9A2E"/><circle cx="68.22" cy="79.08" r="15" fill="#FF7A00"/><circle cx="50.00" cy="85.00" r="15" fill="#FF9A2E"/><circle cx="31.78" cy="79.08" r="15" fill="#FF7A00"/><circle cx="20.52" cy="63.58" r="15" fill="#FF9A2E"/><circle cx="20.52" cy="44.42" r="15" fill="#FF7A00"/><circle cx="31.78" cy="28.92" r="15" fill="#FF9A2E"/>
    <!-- Ears -->
    <circle cx="32" cy="31" r="9" fill="#FFC72C" stroke="#4A2E18" stroke-width="3"/>
    <circle cx="68" cy="31" r="9" fill="#FFC72C" stroke="#4A2E18" stroke-width="3"/>
    <circle cx="32" cy="31" r="4" fill="#FF9A2E"/>
    <circle cx="68" cy="31" r="4" fill="#FF9A2E"/>
    <!-- Face -->
    <circle cx="50" cy="54" r="26" fill="#FFC72C" stroke="#4A2E18" stroke-width="3"/>
    <!-- Brows and eyes -->
    <path d="M33 41 L45 45 M67 41 L55 45" stroke="#4A2E18" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="40" cy="50" rx="3.2" ry="3.8" fill="#4A2E18"/>
    <ellipse cx="60" cy="50" rx="3.2" ry="3.8" fill="#4A2E18"/>
    <!-- Muzzle, nose, roaring mouth with fangs -->
    <ellipse cx="50" cy="65" rx="14" ry="11" fill="#FFF3E0" stroke="#4A2E18" stroke-width="2.5"/>
    <path d="M44.5 55.5 h11 l-5.5 6 z" fill="#4A2E18" stroke="#4A2E18" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M41 64.5 Q50 80 59 64.5 Z" fill="#7A2A12" stroke="#4A2E18" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M43.5 65 l2.5 4.5 l2-4.5 z M52 65 l2 4.5 l2.5-4.5 z" fill="#FFFFFF"/>
  </g>
</svg>
