<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent session</title>
<link rel="stylesheet" href="roar.css">
<style>
/* One agent session (any hooked CLI), live: its terminal screen (tmux or cmux) and a reply box. */
body { background: var(--panel); margin: 0; height: 100vh; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 10px; padding: 14px 20px 10px; }
h1 { margin: 0; font: 800 22px/1.1 var(--round); letter-spacing: -.01em; }
.state { font-size: 12px; color: var(--ink-3); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); flex: none; }
.dot.working, .dot.starting { background: var(--ok); } .dot.needs_you { background: var(--mane); }
pre { flex: 1; margin: 0 20px; padding: 14px 16px; overflow: auto; border-radius: 10px; background: #15100c; color: #eadfd2; font: 12.5px/1.45 var(--mono); white-space: pre; }
.err { color: var(--ink-3); font: 13px var(--ui); white-space: normal; }
form { display: flex; gap: 8px; padding: 10px 20px 4px; }
form input { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 9px; border: 0; background: var(--ground); color: var(--ink); font: 14px var(--ui); box-shadow: inset 0 0 0 1px var(--rule); }
#attach-why { margin: 0 20px; }
#tab-menu { position: fixed; z-index: 9; max-height: 60vh; overflow-y: auto; min-width: 220px; max-width: 360px; padding: 6px; border-radius: 10px; background: var(--ground); box-shadow: 0 0 0 1px var(--rule), 0 8px 24px rgb(0 0 0 / .3); }
#tab-menu h4 { margin: 6px 8px 4px; font: 600 11px var(--ui); color: var(--ink-3); }
#tab-menu button { display: block; width: 100%; text-align: left; padding: 6px 8px; border-radius: 6px; color: var(--ink); font: 13px var(--ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#tab-menu button:hover, #tab-menu button:focus { background: var(--hover); }
form button:not(.btn) { background: var(--mane); color: #2a1604; font-weight: 600; border-radius: 9px; padding: 0 16px; }
.keys { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 20px 16px; }
.keys button { background: var(--ground); border-radius: 7px; padding: 4px 10px; font: 12px var(--mono); color: var(--ink-2); }
.keys button:hover { background: var(--hover); color: var(--ink); }
</style>
</head>
<body>
<header><span class="dot" id="dot" aria-hidden="true"></span><span id="icon"></span><h1 id="name">Agent session</h1><span class="state" id="state" role="status"></span><button class="btn" id="attach">Send tab</button><button class="btn" id="beside" title="Split this view beside the web page you used last">Side by side</button><button class="btn" id="focus" title="Bring its terminal window to the front">Terminal</button></header>
<pre id="screen" aria-live="off"></pre>
<form id="reply"><input id="text" list="slash" placeholder="Reply… (/ for commands; empty Enter accepts)" autocomplete="off" spellcheck="false" aria-label="Reply"><datalist id="slash"></datalist><button>Send</button></form>
<p class="status" id="attach-why" hidden></p>
<div class="ctx" id="tab-menu" role="menu" hidden></div>
<div class="keys" role="group" aria-label="Keys"></div>
<script src="bridge.js"></script>
<script src="cl-session.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search), cwd = params.get('cwd') || '';
let id = params.get('id') || '';
const keys = document.querySelector('.keys');
keys.innerHTML = clSession.keysHtml();
const STATES = { needs_you: 'Needs you', working: 'Working', idle: 'Idle', starting: 'Starting' };

async function meta() {
  const s = await ask({ cmd: 'state' }).then((x) => typeof x === 'string' ? JSON.parse(x) : x);
  const items = s.claude?.items || [];
  let c = items.find((x) => x.id === id);
  // Opened on claude-ctl's new-* stand-in (?cwd=): follow the real session that replaces it.
  if (!c && cwd && id.startsWith('new-')) {
    c = items.find((x) => x.cwd === cwd && !x.id.startsWith('new-'));
    if (c) history.replaceState(null, '', `?id=${encodeURIComponent(id = c.id)}`);
    else return void ($('state').textContent = 'Starting…');
  }
  if (!c) { $('state').textContent = 'This session has ended.'; $('dot').className = 'dot'; $('reply').hidden = $('screen').hidden = keys.hidden = $('focus').hidden = true; return; }
  document.title = `${c.project} · ${agentName(c)}`;
  $('icon').innerHTML = agentIcon(c, 18);
  $('icon').title = agentName(c);
  $('name').textContent = c.project;
  const st = c.acked && c.state === 'needs_you' ? 'working' : (c.state || 'idle');
  $('state').textContent = [STATES[st] || st, c.doing || (c.prompt || '').split('\n')[0]].filter(Boolean).join(' · ');
  $('dot').className = 'dot ' + st;
  $('reply').hidden = $('screen').hidden = keys.hidden = !c.live;
  // This page is the active tab, so "+ This tab" means the web tab used most recently before it.
  webTabs = s.tabs.filter((t) => !t.ghost && !t.active && /^https?:/.test(t.url || '')).sort((a, b) => a.idleSeconds - b.idleSeconds);
  const web = webTabs[0];
  $('attach').disabled = !web || !c.live;
  $('attach').hidden = !c.live;
  $('attach').title = web ? 'Pick a tab: Roar saves it as Markdown and types @file into the prompt. Text in the reply box goes with it and Enter sends both; with none, no Enter' : 'Open a web page in this space first';
  $('attach-why').hidden = !!web || !c.live;
  if (c.cwd !== slashCwd) {
    slashCwd = c.cwd;
    ask({ cmd: 'claude.commands', cwd: c.cwd || '' }).then((x) => {
      const own = typeof x === 'string' ? JSON.parse(x) : x || [];
      $('slash').innerHTML = [...new Set([...own, ...(SLASH[c.tool || 'claude'] || [])])].map((n) => `<option value="/${esc(n)}">`).join('');
    });
  }
  $('attach-why').textContent = 'Open a web page in this space first: only web pages can be attached.';
}
let webTabs = [], slashCwd;
// Built-in / commands per CLI, offered with the user's own commands and skills.
const SLASH = {
  claude: ['clear', 'compact', 'context', 'cost', 'model', 'config', 'resume', 'review', 'init', 'memory', 'mcp', 'agents', 'permissions', 'hooks', 'status', 'help', 'exit', 'rewind', 'export', 'usage'],
  codex: ['new', 'model', 'approvals', 'review', 'diff', 'compact', 'status', 'mcp', 'init', 'mention', 'quit'],
  gemini: ['clear', 'compress', 'chat', 'memory', 'mcp', 'tools', 'stats', 'settings', 'help', 'quit'],
  copilot: ['clear', 'model', 'mcp', 'agent', 'cwd', 'usage', 'help', 'exit'],
};
const esc = (t) => String(t).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
// Text in the reply box goes with the page as its prompt.
$('beside').onclick = () => ask({ cmd: 'claude.beside', id });
// Claude Code's fullscreen UI runs on the terminal's alternate screen, which has no tmux scrollback,
// so a wheel past the mirror's own scroll range pages the session itself.
let wheel = 0, paging = false;
$('screen').addEventListener('wheel', async (e) => {
  const pre = $('screen'), up = e.deltaY < 0;
  if (up ? pre.scrollTop > 0 : pre.scrollTop + pre.clientHeight < pre.scrollHeight - 1) return;
  e.preventDefault();
  if ((wheel += e.deltaY) > -120 && wheel < 120 || paging) return;
  wheel = 0; paging = true;
  await clSession.ctl(id, 'send', up ? 'key:pgup' : 'key:pgdn');
  paging = false; screen();
}, { passive: false });
// The screen is read-only: a click there, or typing anywhere outside a field, goes to the reply box.
$('screen').addEventListener('click', () => { if (!getSelection().toString() && !$('reply').hidden) $('text').focus(); });
document.addEventListener('keydown', (e) => {
  if ($('reply').hidden || e.metaKey || e.ctrlKey || e.altKey || e.key.length !== 1) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  $('text').focus();  // The key's character then lands in the box.
});
// Send tab asks which tab, pinned ones first.
$('attach').onclick = () => {
  const m = $('tab-menu');
  if (!m.hidden) return void (m.hidden = true);
  const group = (label, list) => list.length ? `<h4>${label}</h4>` + list.map((t) => `<button role="menuitem" data-tab="${t.id}" title="${esc(t.url)}">${esc(t.title || t.url)}</button>`).join('') : '';
  m.innerHTML = group('Pinned', webTabs.filter((t) => t.pinned)) + group('Tabs', webTabs.filter((t) => !t.pinned));
  const r = $('attach').getBoundingClientRect();
  m.style.top = r.bottom + 6 + 'px';
  m.style.right = Math.max(8, innerWidth - r.right) + 'px';
  m.hidden = false;
  m.querySelector('button')?.focus();
};
$('tab-menu').onclick = async (e) => {
  const b = e.target.closest('[data-tab]');
  if (!b) return;
  $('tab-menu').hidden = true;
  await ask({ cmd: 'claude.sendTab', id, tab: +b.dataset.tab, text: $('text').value.trim() });
  $('text').value = '';
};
document.addEventListener('mousedown', (e) => { if (!e.target.closest('#tab-menu, #attach')) $('tab-menu').hidden = true; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('tab-menu').hidden = true; });

// Shows a failed control call in the screen area; true when |out| was an error.
const shownError = (out) => {
  const why = clSession.error(out);
  if (why) $('screen').replaceChildren(Object.assign(document.createElement('div'), { className: 'err', textContent: why }));
  return !!why;
};

let busy = false;
// Scales the mirrored screen so its widest line fits the pane (side by side makes it narrow).
function fit() {
  const pre = $('screen'), cols = Math.max(40, ...pre.textContent.split('\n').map((l) => l.length));
  const w = pre.clientWidth - 32;  // padding
  if (w > 0) pre.style.fontSize = Math.max(8, Math.min(12.5, w / (cols * 0.6))) + 'px';
}
addEventListener('resize', fit);

async function screen() {
  if (busy || document.hidden || $('screen').hidden) return;
  busy = true;
  try {
    let out = await clSession.ctl(id, 'screen');
    if (shownError(out)) return;
    const pre = $('screen'), atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 8;
    if (pre.textContent !== (out = out.replace(/\s+$/, ''))) { pre.textContent = out; fit(); if (atBottom) pre.scrollTop = pre.scrollHeight; }
  } finally { busy = false; }
}

$('reply').onsubmit = async (e) => {
  e.preventDefault();
  if (shownError(await clSession.reply(id, $('text').value))) return;
  $('text').value = '';
  screen();
};
keys.onclick = async (e) => {
  const b = e.target.closest('[data-k]');
  if (b && !shownError(await clSession.key(id, b))) screen();
};
$('focus').onclick = async () => shownError(await clSession.ctl(id, 'focus'));

meta().then(screen);
setInterval(screen, 1000);
setInterval(meta, 3000);
</script>
</body>
</html>
