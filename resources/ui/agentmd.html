<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CLAUDE.md Browser</title>
<link rel="stylesheet" href="roar.css">
<style>
body { background: var(--panel); margin: 0; height: 100vh; display: grid; grid-template-columns: 320px minmax(0, 1fr); overflow: hidden; }
aside { border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; }
aside header { padding: 22px 16px 10px; }
h1 { margin: 0 0 12px; font: 800 22px/1 var(--round); letter-spacing: -.02em; }
h1 small { font: 500 12px var(--ui); color: var(--ink-3); margin-left: 6px; letter-spacing: 0; }
input { box-sizing: border-box; width: 100%; font: 13px var(--ui); padding: 8px 11px; border-radius: 8px; border: 1px solid var(--rule); background: var(--ground); color: var(--ink); }
input:focus { outline: 2px solid var(--mane); outline-offset: -1px; }
#list { overflow-y: auto; padding: 4px 8px 24px; flex: 1; }
#list button { display: block; width: 100%; text-align: left; padding: 7px 10px; border-radius: 8px; color: var(--ink-2); font: 500 12.5px var(--ui); }
#list button:hover { background: var(--hover); color: var(--ink); }
#list button[aria-current="true"] { background: var(--mane-soft); color: var(--mane-ink); }
#list b { display: block; color: var(--ink); font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#list span { display: block; color: var(--ink-3); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
main { overflow-y: auto; min-height: 0; }
main .bar { position: sticky; top: 0; background: var(--panel); padding: 18px 28px 10px; border-bottom: 1px solid var(--rule); display: flex; gap: 10px; align-items: center; }
main .bar code { flex: 1; font: 12px ui-monospace, monospace; color: var(--ink-2); overflow-wrap: anywhere; }
main .bar button { padding: 5px 10px; border-radius: 8px; font: 500 12.5px var(--ui); color: var(--ink-2); }
main .bar button:hover { background: var(--hover); color: var(--ink); }
pre { margin: 0; padding: 20px 28px 80px; font: 12.5px/1.6 ui-monospace, monospace; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
.empty { padding: 40px 28px; color: var(--ink-3); font: 13px var(--ui); }
</style>
</head>
<body>
<aside>
  <header>
    <h1>CLAUDE.md<small id="count">Searching your home folder…</small></h1>
    <input id="q" type="search" placeholder="Filter by name or folder" aria-label="Filter files" autofocus>
  </header>
  <div id="list" role="list"></div>
</aside>
<main>
  <div class="bar" id="bar" hidden><code id="path"></code><button id="copy">Copy path</button></div>
  <pre id="text"></pre>
  <div class="empty" id="empty">Pick a file to read it. Roar looks for CLAUDE.md, CLAUDE.local.md, AGENTS.md, GEMINI.md, .cursorrules and similar files under your home folder.</div>
</main>
<script src="bridge.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const home = (p) => p.replace(/^\/Users\/[^/]+/, '~');
let files = [], current = '';

function draw() {
  const q = $('q').value.toLowerCase();
  const shown = files.filter((f) => f.path.toLowerCase().includes(q));
  $('list').replaceChildren(...shown.map((f) => {
    const b = document.createElement('button'), parts = home(f.path).split('/');
    b.setAttribute('role', 'listitem');
    b.dataset.path = f.path;
    b.setAttribute('aria-current', f.path === current);
    b.innerHTML = '<b></b><span></span>';
    b.firstChild.textContent = (parts.at(-2) || '~') + ' / ' + parts.at(-1);
    b.lastChild.textContent = '‎' + parts.slice(0, -1).join('/');
    return b;
  }));
}

async function show(path) {
  current = path; draw();
  try { $('text').textContent = await ask({ cmd: 'agentmd.read', path }); }
  catch { $('text').textContent = 'Couldn’t read this file.'; }
  $('path').textContent = home(path);
  $('bar').hidden = false; $('empty').hidden = true;
  document.querySelector('main').scrollTop = 0;
}

$('list').onclick = (e) => { const b = e.target.closest('button'); if (b) show(b.dataset.path); };
$('q').oninput = draw;
$('copy').onclick = () => navigator.clipboard.writeText(current);

(async () => {
  files = (await ask({ cmd: 'agentmd.list' })).sort((a, b) => b.mtime - a.mtime);
  $('count').textContent = files.length + (files.length === 1 ? ' file' : ' files');
  draw();
})();
</script>
</body>
</html>
