<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent files</title>
<link rel="stylesheet" href="roar.css">
<style>
body { background: var(--panel); margin: 0; height: 100vh; display: grid; grid-template-columns: 320px minmax(0, 1fr); overflow: hidden; }
aside { border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; }
aside header { padding: 22px 16px 10px; }
h1 { margin: 0 0 12px; font: 800 22px/1 var(--round); letter-spacing: -.02em; }
h1 small { font: 500 12px var(--ui); color: var(--ink-3); margin-left: 6px; letter-spacing: 0; }
input { box-sizing: border-box; width: 100%; font: 13px var(--ui); padding: 8px 11px; border-radius: 8px; border: 1px solid var(--rule); background: var(--ground); color: var(--ink); }
input:focus { outline: 2px solid var(--mane); outline-offset: -1px; }
#list { overflow-y: auto; padding: 4px 8px 24px; flex: 1; }
#list ul { list-style: none; margin: 0; padding: 0; }
#list h2 { margin: 0; font: inherit; }
#list li > button { display: block; width: 100%; text-align: left; padding: 7px 10px; border-radius: 8px; color: var(--ink-2); font: 500 12.5px var(--ui); }
#list li > button:hover { background: var(--hover); color: var(--ink); }
#list li > button[aria-current="true"] { background: var(--mane-soft); color: var(--mane-ink); }
#list b { display: block; color: var(--ink); font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#list span { display: block; color: var(--ink-3); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
main { overflow-y: auto; min-height: 0; }
main .bar { position: sticky; top: 0; background: var(--panel); padding: 18px 28px 10px; border-bottom: 1px solid var(--rule); display: flex; gap: 10px; align-items: center; }
main .bar code { flex: 1; font: 12px ui-monospace, monospace; color: var(--ink-2); overflow-wrap: anywhere; }
main .bar .btn { padding: 5px 10px; font-size: 12.5px; }
main .bar .btn.ok { color: var(--ok); }
pre { margin: 0; padding: 20px 28px 80px; font: 12.5px/1.6 ui-monospace, monospace; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
#chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
#list .kind { display: flex; width: 100%; align-items: center; gap: 6px; padding: 10px 10px 4px; font: 700 11px var(--ui); text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); background: none; }
#list .kind:hover { background: none; color: var(--ink); }
#list .kind::before { content: '▾'; transition: transform .12s; }
#list .kind[aria-expanded="false"]::before { transform: rotate(-90deg); }
#list .kind em { font-style: normal; font-weight: 500; }
textarea { box-sizing: border-box; width: 100%; min-height: calc(100vh - 70px); margin: 0; padding: 20px 28px 80px; border: 0; resize: none; font: 12.5px/1.6 ui-monospace, monospace; color: var(--ink); background: var(--ground); }
textarea:focus { outline: 2px solid var(--mane); outline-offset: -2px; }
#msg { font: 12px var(--ui); color: var(--ink-3); }
#msg.err { color: var(--danger); } #msg.ok { color: var(--ok); }
#confirm { display: flex; gap: 8px; align-items: center; padding: 8px 28px; background: var(--mane-soft); color: var(--ink); font: 13px var(--ui); }
#confirm span { flex: 1; }
#confirm .btn { padding: 4px 10px; font-size: 12.5px; background: var(--panel); }
#confirm #discard { color: var(--danger); }
.empty { padding: 40px 28px; color: var(--ink-3); font: 13px var(--ui); }
/* Narrow windows: the list on top (a third of the height), the file below. */
@media (max-width: 720px) {
  body { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 38vh) minmax(0, 1fr); }
  aside { border-right: 0; border-bottom: 1px solid var(--rule); }
  aside header { padding: 14px 14px 8px; }
  main .bar { padding: 10px 14px; flex-wrap: wrap; }
  main .bar code { flex-basis: 100%; order: 9; }
  pre, textarea { padding: 14px 14px 60px; }
  textarea { min-height: 50vh; }
}
</style>
</head>
<body>
<aside>
  <header>
    <h1>Agent files<small id="count">Searching your home folder…</small></h1>
    <input id="q" type="search" placeholder="Filter by path or project" aria-label="Filter files" autofocus>
    <div id="chips" role="group" aria-label="Filter by agent"></div>
  </header>
  <nav id="list" aria-label="Agent files by kind"></nav>
</aside>
<main>
  <div class="bar" id="bar" hidden><button class="btn" id="edit">Edit</button><button class="btn primary" id="save" hidden>Save</button><button class="btn" id="cancel" hidden>Cancel</button><code id="path"></code><span id="msg" role="status"></span><button class="btn" id="copy">Copy path</button><button class="btn" id="reveal">Reveal in Finder</button></div>
  <div id="confirm" role="alertdialog" aria-label="Unsaved changes" hidden><span>Discard your unsaved changes?</span><button class="btn" id="discard">Discard</button><button class="btn" id="keep">Keep editing</button></div>
  <pre id="text"></pre>
  <textarea id="editor" hidden aria-label="File contents" spellcheck="false"></textarea>
  <div class="empty" id="empty">Pick a file to read it. Roar looks for CLAUDE.md, AGENTS.md, GEMINI.md, Cursor, Copilot, Windsurf, Cline, Kiro, Roo, Continue and Junie rules, Claude commands, agents and skills, and similar files under your home folder.</div>
</main>
<script src="bridge.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const home = (p) => p.replace(/^\/Users\/[^/]+/, '~');
const KINDS = ['Claude', 'Cursor', 'Copilot', 'Gemini', 'AGENTS/Codex', 'Windsurf', 'Cline', 'Kiro', 'Roo', 'Continue', 'Junie', 'Aider', 'Other'];
let files = [], current = '', text = '', collapsed = new Set();
let filter = { q: '', kinds: [] };
try { filter = { ...filter, ...JSON.parse(localStorage.getItem('agentFilesFilter') || '{}') }; } catch {}
$('q').value = filter.q || '';
const save = () => { try { localStorage.setItem('agentFilesFilter', JSON.stringify(filter)); } catch {} };
const kindOf = (f) => KINDS.includes(f.kind) ? f.kind : 'Other';

function chips() {
  const present = KINDS.filter((k) => files.some((f) => kindOf(f) === k));
  $('chips').replaceChildren(...present.map((k) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = k; b.dataset.kind = k;
    b.setAttribute('aria-pressed', filter.kinds.includes(k));
    return b;
  }));
}

// One disclosure heading and one list per kind.
function draw() {
  const q = filter.q.toLowerCase();
  const shown = files.filter((f) => (!filter.kinds.length || filter.kinds.includes(kindOf(f))) && f.path.toLowerCase().includes(q));
  const out = [];
  KINDS.forEach((k, i) => {
    const group = shown.filter((f) => kindOf(f) === k);
    if (!group.length) return;
    const open = !collapsed.has(k), h = document.createElement('h2'), b = document.createElement('button'), ul = document.createElement('ul');
    b.className = 'kind'; b.dataset.group = k;
    b.setAttribute('aria-expanded', open);
    b.setAttribute('aria-controls', 'g' + i);
    b.innerHTML = '<span></span><em></em>';
    b.children[0].textContent = k; b.children[1].textContent = group.length;
    h.append(b);
    ul.id = 'g' + i; ul.hidden = !open;
    for (const f of group) {
      const li = document.createElement('li'), fb = document.createElement('button'), parts = home(f.path).split('/');
      fb.dataset.path = f.path;
      if (f.path === current) fb.setAttribute('aria-current', 'true');
      fb.innerHTML = '<b></b><span></span>';
      fb.firstChild.textContent = (parts.at(-2) || '~') + ' / ' + parts.at(-1);
      fb.lastChild.textContent = '\u200e' + parts.slice(0, -1).join('/');
      li.append(fb); ul.append(li);
    }
    out.push(h, ul);
  });
  $('list').replaceChildren(...out);
}

function editing(on) {
  $('editor').hidden = !on; $('text').hidden = on;
  $('save').hidden = $('cancel').hidden = !on;
  $('edit').hidden = on;
  if (on) { $('editor').value = text; $('editor').focus(); }
}
const note = (m, err) => { $('msg').textContent = m; $('msg').className = err ? 'err' : m ? 'ok' : ''; };

async function show(path) {
  current = path; draw(); editing(false); note('');
  try { text = await ask({ cmd: 'agentmd.read', path }); }
  catch { text = ''; note('Couldn\u2019t read this file.', true); }
  $('text').textContent = text;
  $('path').textContent = home(path);
  $('bar').hidden = false; $('empty').hidden = true;
  document.querySelector('main').scrollTop = 0;
}

// Unsaved edits: leaving the editor (another file, Cancel, Escape) asks first, in the page.
let pending = null;
const dirty = () => !$('editor').hidden && $('editor').value !== text;
function leave(then) {
  if (!dirty()) return then();
  pending = then;
  $('confirm').hidden = false;
  $('keep').focus();
}
const settle = (go) => { const f = pending; pending = null; $('confirm').hidden = true; if (go && f) f(); else $('editor').focus(); };
$('discard').onclick = () => settle(true);
$('keep').onclick = () => settle(false);

$('list').onclick = (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.group) {
    const k = b.dataset.group; collapsed.has(k) ? collapsed.delete(k) : collapsed.add(k);
    draw();
    return $('list').querySelector(`[data-group="${CSS.escape(k)}"]`).focus();  // draw() rebuilt it.
  }
  leave(() => show(b.dataset.path));
};
// Roar opens a file here from the sidebar's recent list: ?path= on a new tab, this on an open one.
window.__roarOpen = (path) => leave(() => show(path));
$('chips').onclick = (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const k = b.dataset.kind;
  filter.kinds = filter.kinds.includes(k) ? filter.kinds.filter((x) => x !== k) : [...filter.kinds, k];
  save(); chips(); draw();
};
$('q').oninput = () => { filter.q = $('q').value; save(); draw(); };
$('copy').onclick = () => navigator.clipboard.writeText(current).then(() => {
  $('copy').textContent = 'Copied'; $('copy').classList.add('ok'); note('Path copied');
  setTimeout(() => { $('copy').textContent = 'Copy path'; $('copy').classList.remove('ok'); }, 1500);
}, () => note('Couldn\u2019t copy the path.', true));
$('reveal').onclick = () => ask({ cmd: 'agentmd.reveal', path: current }).catch(() => note('Couldn\u2019t reveal this file.', true));
$('edit').onclick = () => { note(''); editing(true); };
$('cancel').onclick = () => leave(() => { note(''); editing(false); });
document.addEventListener('keydown', (e) => {
  if ($('editor').hidden) return;
  if (e.key === 's' && e.metaKey) { e.preventDefault(); if ($('confirm').hidden) $('save').onclick(); }
  else if (e.key === 'Escape') { e.preventDefault(); $('confirm').hidden ? $('cancel').onclick() : settle(false); }
});
$('save').onclick = async () => {
  const value = $('editor').value;
  try {
    await ask({ cmd: 'agentmd.write', path: current, text: value });
    text = value; $('text').textContent = text; editing(false); note('Saved');
  } catch (e) { note('Couldn\u2019t save: ' + (e?.message || e), true); }
};

(async () => {
  try { files = (await ask({ cmd: 'agentmd.list' })).sort((a, b) => b.mtime - a.mtime); }
  catch { $('count').textContent = "Couldn't list agent files"; return; }
  $('count').textContent = files.length + (files.length === 1 ? ' file' : ' files');
  chips(); draw();
  const want = new URLSearchParams(location.search).get('path');
  if (want) show(want);
})();
</script>
</body>
</html>
