<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<link rel="stylesheet" href="roar.css">
<style>
body { background: var(--ground); display: flex; flex-direction: column; overflow: hidden; user-select: none; }
.top { height: 44px; flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 2px; padding: 0 10px 0 84px; -webkit-app-region: drag; }
.top button { -webkit-app-region: no-drag; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: var(--ink-2); }
.top button:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.top button:disabled { opacity: .35; }
.top svg { width: 15px; height: 15px; }

.address { margin: 2px 10px 10px; height: 34px; border-radius: 9px; background: var(--panel); display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--ink-2); box-shadow: 0 0 0 1px var(--rule); text-align: left; }
.address:hover { color: var(--ink); }
.address .host { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.address svg { width: 13px; height: 13px; flex: none; }

.scroll { flex: 1; overflow-y: auto; padding: 0 6px 12px; display: flex; flex-direction: column; gap: 14px; }

.pinned { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; padding: 0 4px; }
.pinned:empty { display: none; }
.pin { height: 40px; border-radius: 9px; background: var(--hover); display: grid; place-items: center; }
.pin:hover { background: var(--rule); }
.pin.active { background: var(--selected); box-shadow: 0 0 0 1.5px var(--mane); }

.group-head { display: flex; align-items: center; gap: 6px; padding: 0 8px 4px; color: var(--ink-3); font-size: 12px; font-weight: 600; }
.group-head .count { font-weight: 400; font-variant-numeric: tabular-nums; }
.group-head .spacer { flex: 1; }
.group-head button { font-weight: 500; color: var(--ink-2); padding: 2px 6px; border-radius: 5px; }
.group-head button:hover { background: var(--hover); color: var(--ink); }
.group-head .toggle { display: flex; align-items: center; gap: 4px; padding: 2px 0; color: var(--ink-3); font-weight: 600; }
.group-head .toggle:hover { background: none; color: var(--ink-2); }
.chev { width: 9px; height: 9px; transition: transform .12s; }
.collapsed .chev { transform: rotate(-90deg); }
.collapsed .rows { display: none; }

.rows { display: flex; flex-direction: column; gap: 1px; }
.row { position: relative; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 6px 0 8px; border-radius: 7px; text-align: left; width: 100%; }
.row:hover { background: var(--hover); }
.row.active { background: var(--selected); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.row .label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { color: var(--ink-3); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .x { width: 20px; height: 20px; border-radius: 5px; display: none; place-items: center; color: var(--ink-3); flex: none; }
.row:hover .x { display: grid; }
.row .x:hover { background: var(--rule); color: var(--ink); }
.row.cool .label { color: var(--ink-3); }
.row .badge { font-size: 10px; color: var(--mane-ink); background: var(--mane-soft); border-radius: 4px; padding: 0 5px; }
/* Cooling bar: what's left before Clean Tabs archives this tab. */
.row .life { position: absolute; left: 34px; right: 10px; bottom: 3px; height: 2px; border-radius: 1px; background: transparent; }
.row .life i { display: block; height: 100%; border-radius: 1px; background: var(--mane); opacity: .55; }
.row.active .life, .row.pinned-row .life { display: none; }

.fav { width: 16px; height: 16px; flex: none; display: grid; place-items: center; border-radius: 4px; overflow: hidden; }
.fav img { width: 16px; height: 16px; }
.fav.letter { background: var(--rule); color: var(--ink-2); font-size: 10px; font-weight: 700; font-family: var(--round); }
.pin .fav { width: 18px; height: 18px; }
.pin .fav img { width: 18px; height: 18px; }
.spin { width: 16px; height: 16px; flex: none; border-radius: 50%; border: 2px solid var(--rule); border-top-color: var(--mane); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.new { color: var(--ink-2); }
.new .plus { width: 16px; text-align: center; font-size: 16px; line-height: 1; }
.note { color: var(--ink-3); font-size: 12px; padding: 2px 8px 4px; }
.note code { font: 11px var(--mono); }
.pr .label { display: flex; flex-direction: column; line-height: 1.2; }
.pr .label small { color: var(--ink-3); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.pr { height: 40px; }
.pr .dot { width: 8px; height: 8px; border-radius: 50%; background: #2f9e5b; flex: none; margin: 0 4px; }

.foot { flex: none; display: flex; align-items: center; gap: 7px; padding: 8px 14px 12px; color: var(--ink-3); font-size: 11px; border-top: 1px solid var(--rule); }
.foot .wordmark { font-size: 15px; color: var(--ink-2); }
.foot .cdp { font-family: var(--mono); font-size: 10.5px; }
.foot .spacer { flex: 1; }
.foot button { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--ink-3); }
.foot button:hover { background: var(--hover); color: var(--ink); }
.foot svg { width: 14px; height: 14px; }
</style>
</head>
<body>
<div class="top">
  <button id="back" title="Back (⌘[)" aria-label="Back"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg></button>
  <button id="forward" title="Forward (⌘])" aria-label="Forward"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></svg></button>
  <button id="reload" title="Reload (⌘R)" aria-label="Reload"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3"/></svg></button>
</div>
<button class="address" id="address" title="Change address (⌘L)">
  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
  <span class="host" id="host">Search or enter address</span>
</button>
<div class="scroll">
  <div class="pinned" id="pinned"></div>
  <section id="tabs-group">
    <div class="group-head"><span>Tabs</span><span class="count" id="tab-count"></span><span class="spacer"></span><button id="clean" title="Archive every unpinned tab except this one (⇧⌘K)">Clean up</button></div>
    <div class="rows" id="tabs"></div>
    <button class="row new" id="new-tab"><span class="plus">+</span><span class="label">New tab</span><kbd>⌘T</kbd></button>
  </section>
  <section id="gh-group">
    <div class="group-head"><button class="toggle" data-collapse="gh-group"><svg class="chev" viewBox="0 0 10 10" fill="currentColor"><path d="M1 3h8L5 8z"/></svg>Your pull requests</button><span class="count" id="gh-count"></span><span class="spacer"></span><button id="gh-refresh" title="Refresh pull requests">Refresh</button></div>
    <div class="rows" id="gh"></div>
  </section>
  <section id="archive-group" class="collapsed">
    <div class="group-head"><button class="toggle" data-collapse="archive-group"><svg class="chev" viewBox="0 0 10 10" fill="currentColor"><path d="M1 3h8L5 8z"/></svg>Archived</button><span class="count" id="archive-count"></span><span class="spacer"></span><button id="archive-clear" title="Forget archived tabs">Clear</button></div>
    <div class="rows" id="archive"></div>
  </section>
</div>
<div class="foot">
  <span class="lion" style="width:22px;height:22px" aria-hidden="true"></span><span class="wordmark">Roar</span>
  <span class="cdp" id="cdp" title="Chrome DevTools Protocol endpoint"></span>
  <span class="spacer"></span>
  <button id="settings" title="Settings (⌘,)" aria-label="Settings"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
</div>
<script src="bridge.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const x = '<svg viewBox="0 0 12 12" width="10" height="10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m3 3 6 6M9 3l-6 6"/></svg>';
let state = null;

function ago(seconds) {
  if (seconds < 3600) return Math.max(1, Math.round(seconds / 60)) + 'm';
  if (seconds < 86400) return Math.round(seconds / 3600) + 'h';
  return Math.round(seconds / 86400) + 'd';
}

function tabRow(t, limit) {
  const left = limit > 0 ? Math.max(0, 1 - t.idleSeconds / limit) : 1;
  const cool = limit > 0 && left < 0.25 && !t.active;
  const remaining = limit > 0 ? `Archives in ${ago(Math.max(60, limit - t.idleSeconds))}` : '';
  return `<div class="row${t.active ? ' active' : ''}${cool ? ' cool' : ''}" data-id="${t.id}" title="${esc(t.title)}\n${esc(t.url)}${remaining && !t.active ? '\n' + remaining : ''}">
    ${t.loading ? '<span class="spin"></span>' : iconHtml(t.favicon, t.url)}
    <span class="label">${esc(t.title || hostOf(t.url))}</span>
    ${t.floating ? '<span class="badge">floating</span>' : ''}
    <button class="x" data-close="${t.id}" aria-label="Close tab">${x}</button>
    ${limit > 0 && !t.active ? `<span class="life"><i style="width:${(left * 100).toFixed(1)}%"></i></span>` : ''}
  </div>`;
}

window.roar = {
  render(s) {
    state = s;
    const limit = s.settings.archiveAfterHours * 3600;
    const pinned = s.tabs.filter((t) => t.pinned);
    const open = s.tabs.filter((t) => !t.pinned);
    $('pinned').innerHTML = pinned.map((t) =>
      `<button class="pin${t.active ? ' active' : ''}" data-id="${t.id}" title="${esc(t.title)}">${iconHtml(t.favicon, t.url)}</button>`).join('');
    $('tabs').innerHTML = open.map((t) => tabRow(t, limit)).join('');
    $('tab-count').textContent = open.length || '';
    $('back').disabled = !s.nav.canBack;
    $('forward').disabled = !s.nav.canForward;
    const url = s.nav.url || '';
    $('host').textContent = url && !url.startsWith('roar:') ? hostOf(url) : 'Search or enter address';
    $('cdp').textContent = 'CDP :' + s.settings.cdpPort;

    const gh = s.github;
    $('gh-group').hidden = !gh.enabled;
    $('gh-count').textContent = gh.items.length || '';
    $('gh').innerHTML = gh.status
      ? `<div class="note">${esc(gh.status).replace(/`([^`]+)`/g, '<code>$1</code>')}</div>`
      : gh.items.length
        ? gh.items.map((p) => `<button class="row pr" data-url="${esc(p.url)}" title="${esc(p.title)}"><span class="dot"></span><span class="label">${esc(p.title)}<small>${esc(p.detail)}</small></span></button>`).join('')
        : '<div class="note">No open pull requests.</div>';

    $('archive-count').textContent = s.archiveCount || '';
    $('archive-clear').hidden = !s.archiveCount;
    const now = Date.now() / 1000;
    $('archive').innerHTML = s.archive.length
      ? s.archive.map((a, i) => `<button class="row" data-restore="${i}" title="Reopen ${esc(a.url)}">${iconHtml('', a.url)}<span class="label">${esc(a.title || hostOf(a.url))}</span><span class="sub">${ago(now - a.archivedAt)}</span></button>`).join('')
      : '<div class="note">Tabs you clean up land here.</div>';
  },
};

document.addEventListener('click', (e) => {
  const close = e.target.closest('[data-close]');
  if (close) { e.stopPropagation(); return ask({ cmd: 'tab.close', id: +close.dataset.close }); }
  const tab = e.target.closest('[data-id]');
  if (tab) return ask({ cmd: 'tab.activate', id: +tab.dataset.id });
  const restore = e.target.closest('[data-restore]');
  if (restore) return ask({ cmd: 'archive.restore', index: +restore.dataset.restore });
  const pr = e.target.closest('[data-url]');
  if (pr) return ask({ cmd: 'open', text: pr.dataset.url, newTab: true });
  const collapse = e.target.closest('[data-collapse]');
  if (collapse) {
    const group = $(collapse.dataset.collapse);
    group.classList.toggle('collapsed');
    try { localStorage.setItem('collapsed:' + group.id, group.classList.contains('collapsed')); } catch {}
  }
});
document.addEventListener('auxclick', (e) => {
  const tab = e.target.closest('.row[data-id]');
  if (tab && e.button === 1) ask({ cmd: 'tab.close', id: +tab.dataset.id });
});
document.addEventListener('contextmenu', (e) => {
  const tab = e.target.closest('[data-id]');
  if (!tab || !state) return;
  e.preventDefault();
  const t = state.tabs.find((t) => t.id === +tab.dataset.id);
  if (t) ask({ cmd: 'tab.pin', id: t.id, pinned: !t.pinned });
});
$('address').onclick = () => ask({ cmd: 'commandbar', newTab: false });
$('new-tab').onclick = () => ask({ cmd: 'commandbar', newTab: true });
$('back').onclick = () => ask({ cmd: 'run', id: 'back' });
$('forward').onclick = () => ask({ cmd: 'run', id: 'forward' });
$('reload').onclick = () => ask({ cmd: 'run', id: 'reload' });
$('clean').onclick = () => ask({ cmd: 'run', id: 'clean' });
$('gh-refresh').onclick = () => ask({ cmd: 'run', id: 'github' });
$('archive-clear').onclick = () => ask({ cmd: 'archive.clear' });
$('settings').onclick = () => ask({ cmd: 'run', id: 'settings' });
for (const id of ['gh-group', 'archive-group']) {
  try {
    const v = localStorage.getItem('collapsed:' + id);
    if (v !== null) $(id).classList.toggle('collapsed', v === 'true');
  } catch {}
}
ask({ cmd: 'state' }).then((s) => roar.render(s)).catch(() => {});
</script>
</body>
</html>
