<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<link rel="stylesheet" href="roar.css">
<style>
body { background: var(--ground); display: flex; flex-direction: column; overflow: hidden; user-select: none; }
.top { height: 44px; flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 2px; padding: 0 10px 0 84px; -webkit-app-region: drag; }
.top button { -webkit-app-region: no-drag; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: var(--ink-2); }
.top button:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.top button:disabled { opacity: .35; }
.top svg { width: 15px; height: 15px; }

.address { margin: 2px 10px 10px; height: 34px; border-radius: 9px; background: var(--panel); display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--ink-2); box-shadow: 0 0 0 1px var(--rule); text-align: left; }
.address:hover { color: var(--ink); }
.address .host { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.address svg { width: 13px; height: 13px; flex: none; }
.addr-wrap { position: relative; }
.addr-wrap .site { position: absolute; left: 14px; top: 8px; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; }
.addr-wrap .site:hover, .addr-wrap .site[aria-expanded="true"] { background: var(--hover); }
.addr-wrap .site img, .addr-wrap .site span { width: 14px; height: 14px; }
.address.has-site > svg { visibility: hidden; }

.spaces { display: flex; align-items: center; gap: 2px; }
.spaces:empty { display: none; }
.spaces button { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; }
.spaces button::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); opacity: .5; }
.spaces button:hover::before { opacity: 1; }
.spaces button::before { background: var(--dot, var(--ink-3)); }
.spaces button.dragging { opacity: .3; }
.spaces button.drop-before { box-shadow: -2px 0 0 var(--mane); }
.spaces button.drop-after { box-shadow: 2px 0 0 var(--mane); }
.pin.drop-before { box-shadow: -2px 0 0 var(--mane); }
.pin.drop-after { box-shadow: 2px 0 0 var(--mane); }
.spaces button[aria-current="true"]::before { background: var(--dot, var(--mane)); opacity: 1; width: 8px; height: 8px; }
/* Agents (CDP clients) can reach this space: a thin mint ring. The current space is the big opaque dot above, not the ring. */
.spaces button.agents::before { box-shadow: 0 0 0 1.5px var(--ground), 0 0 0 2.5px #7aa898; }
/* An agent is using one of this space's tabs right now: the ring breathes. */
.spaces button.agents.busy::before { animation: ring-busy 1.6s ease-in-out infinite; }
@keyframes ring-busy { 50% { box-shadow: 0 0 0 1.5px var(--ground), 0 0 0 4px rgba(122,168,152,.55); } }
@media (prefers-reduced-motion: reduce) { .spaces button.agents.busy::before { animation: none; box-shadow: 0 0 0 1.5px var(--ground), 0 0 0 3px #7aa898; } }
#settings.tour, #spaces .tour { outline: 2px solid var(--mane); outline-offset: 2px; border-radius: 6px; animation: tour 1.6s ease-in-out infinite; }
@keyframes tour { 50% { outline-color: transparent; } }
@media (prefers-reduced-motion: reduce) { #settings.tour, #spaces .tour { animation: none; } }
.ring-coach { flex: none; display: flex; align-items: center; gap: 6px; margin: 0 10px; padding: 2px 0 0; color: var(--ink-3); font-size: 11px; line-height: 1.3; }
.ring-coach span { flex: 1; }
.ring-coach button { flex: none; width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; color: var(--ink-3); }
.ring-coach button:hover { background: var(--hover); color: var(--ink); }
.space-menu .ring-key { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); box-shadow: 0 0 0 1.5px var(--ground), 0 0 0 2.5px #7aa898; margin-left: 4px; }
body { box-shadow: inset 3px 0 0 var(--space-color, transparent); }
.resize { position: fixed; top: 0; right: 0; bottom: 0; width: 5px; cursor: col-resize; z-index: 10; }
.space-menu { position: fixed; left: 8px; right: 8px; bottom: 44px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; box-sizing: border-box; padding: 6px; border-radius: 10px; background: var(--ground); box-shadow: 0 0 0 1px var(--rule), 0 8px 24px rgba(0,0,0,.35); z-index: 10; }
.space-menu[hidden] { display: none; }
.space-menu input:focus-visible, .ctx input:focus-visible { outline: 2px solid var(--mane); outline-offset: 1px; }
.space-menu input { width: 100%; min-width: 0; box-sizing: border-box; border: 0; padding: 4px 8px; border-radius: 6px; background: var(--panel); color: var(--ink); font: 500 12.5px var(--ui); }
.space-menu .swatches { grid-column: 1 / -1; display: flex; gap: 6px; padding: 2px 2px 0; }
.foot .space-menu .swatches button { width: 18px; height: 18px; padding: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.foot .space-menu .swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.foot .space-menu #space-remove { width: auto; height: auto; }
.foot .space-menu #space-close, .foot .space-menu #space-ai-all, .foot .space-menu #space-ai-loose { grid-column: 1 / -1; width: auto; height: auto; justify-self: start; }
.foot .space-menu #space-agents { grid-column: 1 / -1; width: auto; height: auto; justify-self: start; display: flex; align-items: center; gap: 6px; }
#space-agents::before { content: ""; width: 10px; height: 10px; border-radius: 3px; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
#space-agents[aria-checked="true"]::before { background: #7aa898; box-shadow: none; }
.space-menu button { white-space: nowrap; padding: 4px 8px; border-radius: 6px; color: var(--ink-2); font-size: 12px; }
.space-menu button:hover { color: var(--ink); background: var(--panel); }
.foot .space-name { color: var(--ink-2); font-size: 11.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }
.scroll { flex: 1; overflow-y: auto; padding: 0 6px 12px; display: flex; flex-direction: column; gap: 14px; }

.pinned { --cols: 5; display: flex; flex-wrap: wrap; gap: 6px; padding: 0 4px; }
.pinned > .pin { flex: 0 0 calc((100% - (var(--cols) - 1) * 6px) / var(--cols)); }
.pinned.centered { justify-content: center; }
.pinned:empty { display: none; }
/* While a tab is dragged, an empty pinned strip shows as a drop zone. */
body.drag-active .pinned:empty { display: flex; height: 38px; margin: 0 4px; padding: 0; border: 1px dashed var(--rule); border-radius: 10px; align-items: center; justify-content: center; }
body.drag-active .pinned:empty::before { content: 'Drop to pin'; color: var(--ink-3); font-size: 12px; }
.pin { min-width: 0; height: 38px; border-radius: 10px; background: var(--hover); display: grid; place-items: center; position: relative; }
.pin:hover { background: var(--rule); }
.pin.active { background: var(--selected); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.pin.active::after { content: ""; position: absolute; bottom: 3px; left: 50%; width: 12px; height: 2px; margin-left: -6px; border-radius: 1px; background: var(--mane); }
.pin .fav.letter { background: none; font-size: 13px; color: var(--ink-2); }
.pin .lion { width: 20px; height: 20px; }
.pin .custom { font-size: 18px; line-height: 1; }
.pin img.custom { width: 22px; height: 22px; border-radius: 5px; object-fit: cover; }

.group-head { display: flex; align-items: center; gap: 6px; padding: 0 8px 4px; color: var(--ink-3); font-size: 12px; font-weight: 600; }
.group-head .count { font-weight: 400; font-variant-numeric: tabular-nums; }
.group-head .spacer { flex: 1; }
.group-head button { font-weight: 500; color: var(--ink-2); padding: 2px 6px; border-radius: 5px; }
.group-head button:hover { background: var(--hover); color: var(--ink); }
.group-head .toggle { display: flex; align-items: center; gap: 4px; padding: 2px 0; color: var(--ink-3); font-weight: 600; }
.group-head .toggle:hover { background: none; color: var(--ink-2); }
.chev { width: 9px; height: 9px; transition: transform .12s; }
.collapsed .chev { transform: rotate(-90deg); }
.collapsed .rows { display: none; }

.rows { display: flex; flex-direction: column; gap: 1px; }
.row { position: relative; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 6px 0 8px; border-radius: 7px; text-align: left; width: 100%; }
.row:hover { background: var(--hover); }
.row.active { background: var(--selected); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.row .label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { color: var(--ink-3); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .x { width: 20px; height: 20px; border-radius: 5px; display: grid; opacity: .8; place-items: center; color: var(--ink-3); flex: none; }
.row:hover .x, .row:focus-within .x { opacity: 1; }
.row .x:hover { background: var(--rule); color: var(--ink); }
/* AI rename: shows on hover beside tabs, groups and sessions; spins while the agent works. */
.ai-rn { width: 20px; height: 20px; border-radius: 5px; display: none; place-items: center; color: var(--ink-3); flex: none; }
.row:hover .ai-rn, .row:focus-within .ai-rn, .group-head:hover .ai-rn, .ai-rn.busy { display: grid; }
.cl-acts .ai-rn { display: grid; width: 24px; height: 24px; }
.ai-rn:hover { background: var(--rule); color: var(--ink); }
.ai-rn.busy svg { animation: airn 1s linear infinite; color: var(--mane, #d9822b); }
@keyframes airn { to { transform: rotate(360deg); } }
.ai-undo { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 50; display: flex; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 8px; background: var(--panel); color: var(--ink); border: 1px solid var(--rule); box-shadow: var(--shadow); font-size: 12px; }
.ai-undo span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai-undo button { color: inherit; font-weight: 600; text-decoration: underline; }
.row.cool .label { color: var(--ink-3); }
/* A tab an agent is driving: the same mint wrap and Agent tag the tab's own window wears. */
.row.driven { box-shadow: inset 0 0 0 1.5px #7aa898, 0 0 10px rgba(122,168,152,.35); }
/* Opened or touched by an agent, not active now: a thin faded mint edge and a hollow dashed ring instead of the solid tag. */
.row.agent-was { box-shadow: inset 2px 0 0 rgba(122,168,152,.55); }
.row .agent-was-mark { flex: none; width: 9px; height: 9px; border: 1.5px dashed #7aa898; border-radius: 50%; opacity: .85; }
.row .agent-tag { flex: none; padding: 1px 6px; border-radius: 5px; background: #7aa898; color: #1e140c; font: 700 10px var(--ui); letter-spacing: .01em; }
/* A split pair is one unit: two halves in a row (side by side) or attached top and bottom (stacked). */
.split-pair { position: relative; display: flex; gap: 2px; margin: 2px 0; padding-right: 22px; border-radius: 8px; box-shadow: 0 0 0 1px var(--rule); }
.split-pair.stacked { flex-direction: column; }
.split-pair > .row { flex: 1 1 0; min-width: 0; margin: 0; }
.split-pair > .unsplit-pair { position: absolute; top: 50%; right: 3px; transform: translateY(-50%); width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; color: var(--ink-3); }
.split-pair > .unsplit-pair:hover { background: var(--hover); color: var(--ink); }
.row .badge.unsplit { cursor: pointer; } .row .badge.unsplit:hover { color: var(--ink); }
.row .badge { font-size: 10px; color: var(--mane-ink); background: var(--mane-soft); border-radius: 4px; padding: 0 5px; }
/* Cooling bar: what's left before Clean Tabs archives this tab. */
.row .life { position: absolute; left: 34px; right: 10px; bottom: 3px; height: 2px; border-radius: 1px; background: transparent; }
.row .life i { display: block; height: 100%; border-radius: 1px; background: var(--mane); opacity: .55; }
.row.active .life, .row.pinned-row .life { display: none; }

.fav { width: 16px; height: 16px; flex: none; display: grid; place-items: center; border-radius: 4px; overflow: hidden; }
.fav img { width: 16px; height: 16px; }
.fav.letter { background: var(--rule); color: var(--ink-2); font-size: 10px; font-weight: 700; font-family: var(--round); }
/* Ghost tabs: a private, in-memory profile; their own tinted section. */
#ghost-group { margin: 0 0 8px; padding: 2px 0 4px; border-radius: 10px; background: color-mix(in srgb, #6b5ca5 12%, transparent); }
#ghost-group .group-head { color: #6b5ca5; gap: 6px; }
#art-group .art-ico { width: 13px; height: 13px; margin-right: 5px; vertical-align: -2px; }
.ghost-ico { width: 13px; height: 13px; flex: none; }
.pin .fav { width: 18px; height: 18px; }
.pin .fav img { width: 18px; height: 18px; }
.spin { width: 16px; height: 16px; flex: none; border-radius: 50%; border: 2px solid var(--rule); border-top-color: var(--mane); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Tab groups: their own section beside Tabs, headed by the group's name. */
.tgroup { margin-bottom: 8px; }
.tgroup .group-head { cursor: default; }
.tgroup .gname { font-weight: 600; }
.tgroup .gdot { width: 8px; height: 8px; border-radius: 50%; background: var(--gc, var(--ink-3)); flex: none; }
.tgroup .gname { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tgroup .gpin { width: 10px; height: 10px; color: var(--ink-3); flex: none; }
.tgroup .rows { margin-left: 6px; padding-left: 6px; box-shadow: inset 2px 0 0 var(--gc, var(--rule)); }
.tgroup.collapsed .rows { display: none; }
.tgroup .empty { color: var(--ink-3); font-size: 12px; padding: 4px 8px; }
.drop-target { background: var(--hover); border-radius: 8px; }
.row.dragging { opacity: .4; }
/* The line where a dragged tab will land among the rows (rowSpot). */
.row.drop-before { box-shadow: 0 -2px 0 var(--mane); }
.row.drop-after { box-shadow: 0 2px 0 var(--mane); }
/* Dropping a tab on another tab splits them; the half under the pointer picks the layout. */
.row.split-drop { position: relative; background: var(--hover); box-shadow: inset 0 0 0 1.5px var(--mane); }
.row.split-drop::after { content: attr(data-split-label); position: absolute; right: 8px; top: 50%; transform: translateY(-50%); padding: 2px 7px; border-radius: 6px; background: var(--mane); color: #2a1604; font: 600 11px var(--ui); pointer-events: none; }
.pin.split-drop { background: var(--hover); box-shadow: inset 0 0 0 1.5px var(--mane); }
.ctx { position: fixed; z-index: 20; min-width: 180px; max-width: 240px; padding: 4px; border-radius: 9px; background: var(--ground); box-shadow: 0 0 0 1px var(--rule), 0 8px 24px rgba(0,0,0,.35); display: flex; flex-direction: column; }
.ctx[hidden] { display: none; }
.ctx button { text-align: left; padding: 5px 8px; border-radius: 6px; color: var(--ink); font-size: 12.5px; display: flex; align-items: center; gap: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctx button:hover { background: var(--hover); }
.ctx button:disabled { color: var(--ink-3); background: none; }
.ctx hr { border: 0; border-top: 1px solid var(--rule); margin: 4px 2px; }
.ctx .head { color: var(--ink-3); font-size: 11px; padding: 4px 8px 2px; }
.ctx .gdot { width: 8px; height: 8px; border-radius: 50%; background: var(--gc, var(--ink-3)); flex: none; }
.ctx input { margin: 2px; border: 0; padding: 5px 8px; border-radius: 6px; background: var(--panel); color: var(--ink); font: 500 12.5px var(--ui); }
.ctx .swatches { display: flex; gap: 6px; padding: 4px 6px; }
.ctx .swatches button { width: 16px; height: 16px; padding: 0; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.ctx .swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }

.note { color: var(--ink-3); font-size: 12px; padding: 2px 8px 4px; }
.note code { font: 11px var(--mono); }
.pr .label { display: flex; flex-direction: column; line-height: 1.2; }
.pr .label small { color: var(--ink-3); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.pr { height: 40px; }
.pr .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; margin: 0 4px; }
.mail .dot { background: var(--acct, #d9822b); }
/* Agent sessions: the dot says working (pulsing), needs you (orange, the row pulses) or idle;
   the same state is in the row's text for screen readers. */
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.cl .dot.idle { background: var(--ink-3); } .cl .dot.needs_you { background: var(--mane, #d9822b); }
/* Still, never blinking: a tinted row and an orange dot say a session needs you. */
.cl .dot.working, .cl .dot.starting { background: var(--ok); }
/* A session's own color (set in its full view) tints its row; needing you only bolds the name. */
.cl.tint { background: color-mix(in srgb, var(--cl-bg) 20%, transparent); }
.cl.needs .cl-name b { font-weight: 650; }
/* Two lines per session: name and age, then what it's doing (wraps to two lines, never mid-word
   on one). Actions float over the right edge on hover, so they never take width from the text. */
.cl.pr { height: auto; min-height: 34px; padding-block: 4px; align-items: flex-start; }
.cl .clmain { align-items: flex-start; }
.cl .label { white-space: normal; overflow: visible; gap: 2px; }
.cl .cl-name { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.cl .cl-name b { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cl .cl-name time { flex: none; color: var(--ink-3); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.cl .label small { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; white-space: normal; overflow: hidden; line-height: 1.3; overflow-wrap: anywhere; }
.cl.needs .label small { color: var(--ink-2); }
.cl-ic { position: relative; flex: none; width: 16px; height: 16px; margin-top: 1px; }
.cl-ic .agent-icon { display: block; }
.cl-ic .ask-badge { position: absolute; right: -4px; bottom: -4px; width: 9px; height: 9px; border-radius: 3px; background: var(--ground); color: var(--ink-2); display: grid; place-items: center; }
.cl-ic .ask-badge svg { width: 9px; height: 9px; }
/* Code (agent sessions) and Ask (chats) subheads, shown only when both kinds are listed. */
.cl-sub { margin: 6px 10px 2px; font: 600 10.5px var(--ui); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
.cl-ic .dot { position: absolute; right: -3px; bottom: -3px; width: 7px; height: 7px; margin: 0; box-shadow: 0 0 0 2px var(--ground); }
.cl-acts { position: absolute; top: 5px; right: 4px; display: flex; gap: 1px; padding-left: 14px; opacity: 0; pointer-events: none; transition: opacity .12s ease-out;
  background: linear-gradient(to right, transparent, var(--ground) 14px); }
.cl:hover .cl-acts, .cl:focus-within .cl-acts { opacity: 1; pointer-events: auto; }
.cl:hover .cl-name time, .cl:focus-within .cl-name time { visibility: hidden; }
.cl-acts button { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; color: var(--ink-2); }
.cl-acts button:hover { background: var(--hover); color: var(--ink); }
.cl-acts button[aria-disabled=true] { opacity: .35; cursor: default; }
.cl-acts button[aria-pressed=true] { color: var(--mane, #d9822b); }
.cl .cl-reply { align-self: flex-start; margin-top: 4px; padding: 2px 8px; border-radius: 999px; font: 600 11px var(--ui); background: var(--mane-soft, rgba(217,130,43,.18)); color: var(--mane, #d9822b); }
.af-row { width: 100%; } .af-row .agent-icon { color: var(--ink-2); }
.cl .clmain { display: flex; align-items: flex-start; gap: 8px; flex: 1; min-width: 0; height: 100%; text-align: left; cursor: pointer; }
.cl { cursor: pointer; }
.cl.starting { cursor: default; opacity: .8; }
/* A session that needs you: one reply line under its row (the full view has everything else). */
.clq { position: relative; margin: 0 4px 8px 30px; }
.gh-q { display: flex; gap: 4px; padding: 0 10px 8px; }
.gh-q input { flex: 1; min-width: 0; font: 11.5px var(--mono); padding: 4px 7px; border-radius: 6px; border: 1px solid var(--rule); background: var(--ground); color: var(--ink); }
.gh-q button { color: var(--ink-2); padding: 0 6px; font-size: 11.5px; }
.clq input { width: 100%; box-sizing: border-box; padding: 7px 60px 7px 9px; border: 0; border-radius: 6px; background: var(--ground); color: var(--ink); font: 12px var(--ui); box-shadow: inset 0 0 0 1px var(--rule); }
.clq .clq-acts { position: absolute; top: 3px; right: 3px; bottom: 3px; display: flex; gap: 2px; }
.clq button { width: 26px; display: grid; place-items: center; border-radius: 5px; color: var(--ink-2); }
.clq button:hover { background: var(--hover); color: var(--ink); }
.clq .send { background: var(--mane, #d9822b); color: #2a1604; } .clq .send:hover { background: var(--mane, #d9822b); color: #2a1604; filter: brightness(1.08); }
.clq button:disabled, .clq button[aria-disabled=true] { opacity: .5; cursor: default; }
.group-head button[aria-disabled=true] { opacity: .45; cursor: default; }
#cl-group { margin-top: 8px; }
#cl-group .group-head { gap: 2px; } #cl-group .group-head button { white-space: nowrap; flex: none; }
#cl-group .group-head .toggle { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; } #cl-group .group-head .count { margin-left: 4px; } #cl-group .toggle .chev { flex: none; }
.feed[aria-pressed="true"] { background: var(--hover); }
/* New session: a centered modal, type first, then where. */
.cld { width: calc(100% - 24px); max-width: 320px; padding: 14px; border: 0; border-radius: 12px; background: var(--ground); color: var(--ink); box-shadow: 0 0 0 1px var(--rule), 0 12px 32px rgba(0,0,0,.4); font-size: 12.5px; }
.cld::backdrop { background: rgba(0,0,0,.35); }
.cld h2 { margin: 0 0 10px; font-size: 13.5px; font-weight: 600; }
.cld form { display: grid; gap: 10px; }
.cld legend { padding: 0 0 6px; color: var(--ink-3); font-size: 11.5px; font-weight: 600; }

  <button class="feed" id="gh-btn" data-feed="gh-group" title="GitHub PRs" aria-label="GitHub PRs" hidden><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><span class="badge" id="gh-count"></span></button>
  <button class="feed" id="ol-btn" title="Outlook" aria-label="Outlook" hidden><svg viewBox="0 0 24 18"><path fill="#0a64ad" d="M10 3h12.4c.9 0 1.6.7 1.6 1.6v8.8c0 .9-.7 1.6-1.6 1.6H10z"/><path fill="none" stroke="#fff" stroke-width="1.3" stroke-linejoin="round" d="M12.5 5.5 17 9l4.5-3.5"/><rect fill="#1490df" x="0" y="1" width="13" height="16" rx="2"/><circle cx="6.5" cy="9" r="3.6" fill="none" stroke="#fff" stroke-width="2"/></svg><span class="badge" id="ol-count"></span></button>
  <button class="feed" id="gm-btn" data-feed="gm-group" title="Unread mail" aria-label="Unread mail" hidden><svg viewBox="0 0 24 18"><path fill="#4285f4" d="M1.6 18h3.8V8.7L0 4.6v11.8C0 17.3.7 18 1.6 18z"/><path fill="#34a853" d="M18.6 18h3.8c.9 0 1.6-.7 1.6-1.6V4.6l-5.4 4.1z"/><path fill="#fbbc04" d="M18.6 1.6v7.1L24 4.6V2.4c0-2-2.3-3.1-3.9-1.9z"/><path fill="#ea4335" d="M5.4 8.7V1.6L12 6.5l6.6-4.9v7.1L12 13.6z"/><path fill="#c5221f" d="M0 2.4v2.2l5.4 4.1V1.6L3.9.5C2.3-.7 0 .4 0 2.4z"/></svg><span class="badge" id="gm-count"></span></button>
</div>
<div class="ctx" id="ctx" hidden></div>
<div class="dict" id="dict" role="status" aria-live="polite" hidden></div>
<div class="foot">
  <span class="brand"><span class="lion" style="width:22px;height:22px" aria-hidden="true"></span><span class="wordmark">Roar</span>
  <span class="space-name" id="space-name"></span></span>
  <span class="spaces" id="spaces" role="group" aria-label="Spaces"></span>
  <div class="space-menu" id="space-menu" hidden><input id="space-rename" maxlength="40" aria-label="Space name" spellcheck="false"><button id="space-ai" title="Ask your agent to name this space (Shift-click: choose the agent)">Name with AI</button><button id="space-ai-all" title="Rename every tab in this space with AI; groups keep their names (Shift-click: choose the agent)">Rename all tabs with AI</button><button id="space-ai-loose" title="Rename the tabs not in a group or pinned (Shift-click: choose the agent)">Rename ungrouped tabs with AI</button><button id="space-remove" title="Archive its tabs and remove the space">Remove</button><button id="space-close" title="Close this space's tabs (pinned stay) and switch to the next space">Close all tabs</button><button id="space-agents" role="menuitemcheckbox" aria-checked="true" title="Let AI agents (CDP clients) see and open this space's tabs. A ring around the space's dot means they can.">Allow agents <span class="ring-key" aria-hidden="true"></span></button><div class="swatches" id="swatches" role="group" aria-label="Space color"></div></div>
  <span class="spacer"></span>
  <button id="mic" aria-pressed="false" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="5.5" y="1.8" width="5" height="8" rx="2.5"/><path d="M3.2 7.6a4.8 4.8 0 0 0 9.6 0M8 12.4v2"/></svg></button>
  <span class="tools">
    <button id="settings" title="Settings (⌘,)" aria-label="Settings"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 5h11M2.5 11h11"/><circle class="knob" cx="5.5" cy="5" r="1.8"/><circle class="knob" cx="10.5" cy="11" r="1.8"/></svg></button>
  </span>
</div>
<script src="bridge.js"></script>
<script src="cl-session.js"></script>
<script src="chat-core.js"></script>
<script src="space-dots.js"></script>
<script src="artifact-group.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const SPEAKER = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.3 3.7a6 6 0 0 1 0 8.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
const SPEAKER_OFF = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="m10.5 6 4 4m0-4-4 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
const sndButton = (t, cls) => (t.audible || t.muted)
  ? `<button class="${cls} snd${t.muted ? ' muted' : ''}" data-mute="${t.id}" title="${t.muted ? 'Unmute tab' : 'Mute tab'}" aria-label="${t.muted ? 'Unmute tab' : 'Mute tab'}">${t.muted ? SPEAKER_OFF : SPEAKER}</button>` : '';
const x = '<svg viewBox="0 0 12 12" width="10" height="10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m3 3 6 6M9 3l-6 6"/></svg>';
let state = null;

function ago(seconds) {
  if (seconds < 3600) return Math.max(1, Math.round(seconds / 60)) + 'm';
  if (seconds < 86400) return Math.round(seconds / 3600) + 'h';
  return Math.round(seconds / 86400) + 'd';
}

// Agent-opened or agent-touched tabs say so in words, not only in color.
function agentNote(t) {
  if (t.agentActive) return 'An agent is using this tab now';
  const s = Math.max(0, Date.now() / 1000 - t.agentLast);
  return `Opened by an agent · last active ${s < 60 ? 'just now' : ago(s) + ' ago'}`;
}

function tabRow(t, limit, inPair) {
  const left = limit > 0 ? Math.max(0, 1 - t.idleSeconds / limit) : 1;
  const cool = limit > 0 && left < 0.25 && !t.active;
  const remaining = limit > 0 ? `Archives in ${ago(Math.max(60, limit - t.idleSeconds))}` : '';
  return `<div class="row${t.active ? ' active' : ''}${cool ? ' cool' : ''}${t.agentActive ? ' driven' : t.agentMark ? ' agent-was' : ''}" data-id="${t.id}" draggable="true" title="${esc(t.title)}\n${esc(t.url)}${t.agentMark ? '\n' + agentNote(t) : ''}${remaining && !t.active ? '\n' + remaining : ''}">
    ${t.loading ? '<span class="spin"></span>' : t.url.startsWith('roar:') ? '<span class="lion" style="width:16px;height:16px"></span>' : iconHtml(t.favicon, t.url)}
    <span class="label">${esc(t.name || t.title || hostOf(t.url))}</span>
    ${t.agentActive ? `<span class="agent-tag" role="img" aria-label="${agentNote(t)}" title="${agentNote(t)}">Agent</span>` : t.agentMark ? `<span class="agent-was-mark" role="img" aria-label="${agentNote(t)}" title="${agentNote(t)}"></span>` : ''}${t.floating ? '<span class="badge">floating</span>' : ''}${t.split && !inPair ? `<button class="badge unsplit" data-unsplit="${t.id}" title="Separate tabs">split ×</button>` : ''}
    ${sndButton(t, '')}${t.ghost ? '' : aiRn('tab', t.id, t.name || t.title)}
    <button class="x" data-close="${t.id}" aria-label="Close tab">${x}</button>
    ${limit > 0 && !t.active ? `<span class="life"><i style="width:${(left * 100).toFixed(1)}%"></i></span>` : ''}
  </div>`;
}

window.roar = {
  render(s) {
    state = s;
    aiSettle();
    const limit = s.settings.archiveAfterHours * 3600;
    const ghosts = s.tabs.filter((t) => t.ghost && !t.split);
    // A Claude session in full view is shown by its session row, not as a tab.
    const clFull = {};
    for (const t of s.tabs) { const m = /^roar:\/\/ui\/claude\.html\?id=([\w-]+)/.exec(t.url || ''); if (m) clFull[m[1]] = t; }
    // Split pairs (any tab, agent views too) show together in Split; unsplit, each is back where it was.
    const byId = Object.fromEntries(state.tabs.map((t) => [t.id, t]));
    const pairs = state.tabs.filter((t) => t.split && t.splitFirst && byId[t.splitWith]).map((t) => [t, byId[t.splitWith]]);
    $('split-group').hidden = !pairs.length;
    $('split-count').textContent = pairs.length || '';
    setHtml($('split-tabs'), pairs.map(([a, b]) => `<div class="split-pair${a.stacked ? ' stacked' : ''}">${tabRow(a, 0, true)}${tabRow(b, 0, true)}<button class="unsplit-pair" data-unsplit="${a.id}" title="Separate" aria-label="Separate split tabs">${x}</button></div>`).join(''));
    // Ask chats live under AI (their rows), not in the tab list, while that section shows.
    const aiShown = s.settings?.claudeSidebar !== false && s.settings?.agentSection !== false;
    s = { ...s, tabs: s.tabs.filter((t) => !t.ghost && !t.split && !/^roar:\/\/ui\/claude\.html/.test(t.url || '') && !(aiShown && askTab(t))) };
    const pinned = s.tabs.filter((t) => t.pinned);
    // Claude Artifacts the person opened get their own section while one is open (artifact-group.js).
    const arts = s.tabs.filter((t) => artifactGrouped(t, s.settings));
    $('art-group').hidden = !arts.length;
    $('art-count').textContent = arts.length || '';
    setHtml($('art-tabs'), arts.map((t) => tabRow(t, limit)).join(''));
    const open = s.tabs.filter((t) => !t.pinned && !t.group && !arts.includes(t));  // Mail/PR tabs too: everything opened is a real tab.
    $('ghost-group').hidden = !ghosts.length;
    setHtml($('ghost-tabs'), ghosts.map((t) => tabRow(t, 0)).join(''));
    $('ghost-count').textContent = ghosts.length || '';
    const folderTab = (f) => s.tabs.find((t) => t.folder === f && !t.pinned && !t.group);
    // The folder's tab stands in for the link it opened; elsewhere it leads the list.
    const folderRows = (f, items, row) => {
      const ft = folderTab(f);
      const at = ft ? items.findIndex((i) => i.url === ft.folderItem) : -1;
      return (ft && at < 0 ? tabRow(ft, 0) : '') + items.map((i, n) => n === at ? tabRow(ft, 0) : row(i)).join('');
    };
    const groupHtml = (g) => {
      const tabs = s.tabs.filter((t) => t.group === g.id);
      return `<section class="tgroup${g.collapsed ? ' collapsed' : ''}" data-group="${g.id}" style="${g.color ? '--gc:' + g.color : ''}">
        <div class="group-head" data-group-head="${g.id}"><button class="toggle" data-group-toggle="${g.id}" aria-label="${g.collapsed ? 'Expand' : 'Collapse'} group ${esc(g.name)}" aria-expanded="${!g.collapsed}"><svg class="chev" viewBox="0 0 10 10" fill="currentColor"><path d="M1 3h8L5 8z"/></svg></button><span class="gdot"></span><span class="gname">${esc(g.name)}</span><span class="count">${tabs.length || ''}</span>${aiRn('group', g.id, g.name)}${g.pinned ? '<svg class="gpin" viewBox="0 0 16 16" fill="currentColor"><path d="M9.8 1.5 14.5 6.2l-1.4.4-3 3 .1 3-1.2 1.2-2.6-2.6L3 14.6 1.4 13l3.4-3.4-2.6-2.6L3.4 5.8l3 .1 3-3z"/></svg>' : ''}</div>
        <div class="rows">${tabs.map((t) => tabRow(t, g.pinned ? 0 : limit)).join('') || '<div class="empty">Drag tabs here</div>'}</div>
      </section>`;
    };
    const groups = s.groups || [];
    setHtml($('pinned-groups'), groups.filter((g) => g.pinned).map(groupHtml).join(''));
    setHtml($('groups'), groups.filter((g) => !g.pinned).map(groupHtml).join(''));
    // Spaces stay out of the way: only a name and dots in the footer, and
    // nothing at all until a second space exists.
    const multi = s.spaces.length > 1;
    const cur = s.spaces.find((sp) => sp.id === s.activeSpace);
    document.body.style.setProperty('--space-color', cur?.color || 'transparent');
    $('space-name').style.color = cur?.color || '';
    $('space-name').textContent = multi ? (s.spaces.find((sp) => sp.id === s.activeSpace)?.name || '') : '';
    // One dot shows even with a single space: clicking it is how agent access is switched (space-dots.js).
    $('spaces').innerHTML = s.spaces.map((sp, i) => { const d = spaceDot(sp, s, i);
      return `<button data-space="${sp.id}" draggable="true"${d.ring ? ` class="agents${d.busy ? ' busy' : ''}"` : ''} aria-current="${d.active}" style="${sp.color ? '--dot:' + sp.color : ''}" title="${esc(d.title)}" aria-label="${esc(d.label)}"></button>`; }).join('');
    layoutPins(s.settings);
    setHtml($('pinned'), pinned.map((t) =>
      `<button class="pin${t.active ? ' active' : ''}" data-id="${t.id}" draggable="true" title="${esc(t.title)}" aria-label="${esc(t.title)}">${pinIcon(t)}${sndButton(t, '')}</button>`).join(''));
    setHtml($('tabs'), open.map((t) => tabRow(t, limit)).join(''));
    $('tab-count').textContent = open.length || '';
    setHtml($('loose-ai'), aiRn('ungrouped', s.activeSpace, 'ungrouped tabs'));
    // The AI chosen in Settings (askLlms; older saves listed several, the first wins), as the command bar's "Ask … about this page".
    const llm = (s.settings?.askLlms || '').split(',')[0], askAct = s.tabs.find((t) => t.active);
    $('ask-llm').hidden = !llm;
    $('ask-llm').dataset.llm = llm;
    $('ask-llm').setAttribute('aria-disabled', String(!/^https?:/.test(askAct?.url || '')));
    $('back').disabled = !s.nav.canBack;
    $('forward').disabled = !s.nav.canForward;
    const url = s.nav.url || '';
    $('host').textContent = url && !url.startsWith('roar:') ? hostOf(url) : 'Search or enter address';
    // The site icon opens the per-site menu (siteMenu); only real web pages have one.
    const siteOk = /^https?:/.test(url) && !!askAct && !askAct.ghost;
    $('site').hidden = !siteOk;
    $('address').classList.toggle('has-site', siteOk);
    setHtml($('site'), siteOk ? iconHtml(askAct.favicon, url) : '');
    const alerts = s.alerts || [];
    const ago = (t) => { const m = Math.round((Date.now() / 1000 - t) / 60); return m < 1 ? 'now' : m < 60 ? m + ' min ago' : Math.round(m / 60) + ' h ago'; };
    // Cards are kept by id and only changed ones are redrawn, so a screen reader reads each once.
    const box = $('alerts'), keep = new Set(alerts.map((a) => String(a.id)));
    // A card whose reply is being typed or was just sent outlives its timeout (it goes 3 s after sending).
    for (const el of [...box.querySelectorAll('[data-alert]')]) if (!keep.has(el.dataset.alert) && !el.querySelector('.alert-reply.sreply')) el.remove();
    let clear = box.querySelector('.clear-all');
    if (alerts.length > 1 && !clear) box.insertAdjacentHTML('afterbegin', '<button class="clear-all" data-alert-clear>Clear all</button>');
    else if (alerts.length <= 1 && clear) clear.remove();
    for (const a of alerts) {
      const link = a.url || alertLink(a.body);
      const html = `<div class="who"><span>${esc(a.agent || 'Agent')}${alertChat(a, s) ? ' · ' + esc(alertChat(a, s)) : ''}</span><span>${ago(a.time)}</span></div>
        <div class="t">${esc(a.title)}</div>${a.body ? `<div class="b">${linkify(a.body)}</div>` : ''}${a.body && (a.body.length > 220 || a.body.split('\n').length > 4) ? '<button class="more" data-alert-more aria-expanded="false">more</button>' : ''}
        <div class="acts">${a.choices.map((c, i) => `<button class="${i === 0 ? 'primary' : ''}" data-alert-choice="${esc(c)}">${esc(c)}</button>`).join('')}${a.waiting ? '<button data-alert-reply>Reply</button>' : ''}${(({ reply, term } = alertSession(a, s.claude?.items, /Win/.test(navigator.platform))) => reply ? `<button data-alert-sreply="${esc(reply)}">Reply</button>` : term ? `<button data-alert-term="${esc(term)}" title="Bring its terminal window to the front">Show terminal</button>` : '')()}${a.body ? '<button data-alert-copy title="Copy the full message">Copy</button>' : ''}${link ? `<button data-alert-open="${esc(link)}" data-alert-space="${a.space ?? -1}"${a.url ? ' data-alert-answer' : ''}>Open</button>` : ''}</div>
        <button class="dismiss" data-alert-dismiss aria-label="Dismiss" title="${a.waiting ? 'Dismiss without answering' : 'Dismiss'}"><svg viewBox="0 0 12 12" width="9" height="9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="m3 3 6 6M9 3l-6 6"/></svg></button>`;
      let el = box.querySelector(`[data-alert="${a.id}"]`);
      if (!el) { el = Object.assign(document.createElement('div'), { className: 'alert' }); el.dataset.alert = a.id; box.append(el); }
      el.classList.remove('done', 'needs_you', 'info'); el.classList.add(a.level); el.classList.toggle('auto-done', !!a.autoDone);
      el.__body = a.body || '';
      if (el.__html !== html && !el.querySelector('.alert-reply')) { el.innerHTML = el.__html = html; el.classList.remove('full'); }
    }

    $('dl-btn').hidden = !(s.downloads && s.downloads.count);
    $('dl-count').textContent = (s.downloads && s.downloads.active) || '';
    const gh = s.github;
    $('gh-btn').hidden = !gh.enabled;
    $('gh-count').textContent = gh.items.length || '';
    if (document.activeElement !== $('gh-qin')) $('gh-qin').value = gh.query || '';
    setHtml($('gh'), gh.status
      ? (folderTab('github') ? tabRow(folderTab('github'), 0) : '') + `<div class="note">${esc(gh.status).replace(/`([^`]+)`/g, '<code>$1</code>')}</div>`
      : gh.items.length
        ? folderRows('github', gh.items, (p) => `<button class="row pr" data-url="${esc(p.url)}" title="${esc(p.title)}"><span class="dot"></span><span class="label">${esc(p.title)}<small>${esc(p.detail)}</small></span></button>`)
        : folderRows('github', [], () => '') + '<div class="note">No open pull requests.</div>');

    // Agent sessions (Claude Code, Codex, Gemini... hooked in from Settings): the module icon, its badge counting only the
    // sessions that need you, and a list in start order (newest first) so rows never jump. A row opens the session's full view.
    const needs = (c) => c.state === 'needs_you' && !c.acked;
    const names = agentNames(s);
    const cl = (s.claude?.items || []).map((c) => names[c.id] ? { ...c, project: names[c.id] } : c).sort((a, b) => (b.started || b.updated) - (a.started || a.updated) || (a.id < b.id ? -1 : 1));
    // Hidden sessions live in settings so they stay hidden after a restart; ids of gone sessions are dropped.
    clHiddenAt = clHiddenMap(s);
    const clPruned = clHiddenPrune(clHiddenAt, cl.map((c) => c.id));
    if (clPruned) { clHiddenAt = clPruned; saveClHidden(); }
    const clAgo = (ms) => { const m = Math.round((Date.now() - ms) / 60000); return m < 1 ? 'now' : m < 60 ? m + ' min' : m < 1440 ? Math.round(m / 60) + ' h' : Math.round(m / 1440) + ' d'; };
    const clStates = { needs_you: 'Needs you', working: 'Working', idle: 'Idle', starting: 'Starting' };
    const act = s.tabs.find((t) => t.active), webTab = act && /^https?:/.test(act.url || '');
    const ico = {
      attach: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 7.5l-5.3 5.3a3.2 3.2 0 01-4.5-4.5l5.6-5.6a2.1 2.1 0 013 3L6.3 11.2a1 1 0 01-1.5-1.5L10 4.6"/></svg>',
      term: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.8" y="2.8" width="12.4" height="10.4" rx="2"/><path d="M4.6 6.4l2 1.6-2 1.6M8.6 9.8h2.8"/></svg>',
      reply: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.2a1.6 1.6 0 011.6-1.6h7.8a1.6 1.6 0 011.6 1.6v5a1.6 1.6 0 01-1.6 1.6H7l-3 2.6v-2.6h0a1.6 1.6 0 01-1.5-1.6z"/></svg>',
      beside: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><rect x="1.8" y="2.8" width="12.4" height="10.4" rx="2"/><path d="M8 2.8v10.4"/></svg>',
      hide: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
      send: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3.5M4 7.2L8 3.2l4 4"/></svg>',
    };
    // "Claude is waiting for your input" → "Waiting for your input": the icon already names the tool.
    const tidy = (t) => (t || '').replace(/^(Claude|Codex|Gemini|Qwen|Copilot)( Code| CLI)? (is|has|needs) /i, (m, a, b, v) => v.toLowerCase() === 'is' ? '' : v + ' ').replace(/^./, (x) => x.toUpperCase());
    const attachAttrs = webTab ? `title="Send the tab you're looking at, with a prompt if you like: Roar saves it as Markdown and types @file into the session's prompt"` : 'aria-disabled="true" title="Switch to a web page first: only web pages can be sent"';
    const clRow = (c) => {

  if (!b || b.scrollHeight <= b.clientHeight || r.getBoundingClientRect().bottom < b.getBoundingClientRect().bottom - 20) return;
  const all = r.cloneRange(); all.setEnd(b, b.childNodes.length);

});

document.addEventListener('click', (e) => {
  const alert = e.target.closest('[data-alert]');
  if (alert) {

    const lk = e.target.closest('a[data-alert-link]');

    if (b?.dataset.alertOpen) { ask({ cmd: 'open', text: b.dataset.alertOpen, newTab: true, ...(+b.dataset.alertSpace >= 0 ? { space: +b.dataset.alertSpace } : {}) }); // A link taken from the body is not the agent's answer target, so a waiting card stays open.
      if (b.hasAttribute('data-alert-answer')) ask({ cmd: 'agent.answer', id, choice: 'opened' }); return; }

    if (b?.hasAttribute('data-alert-reply')) {
      // Beside the choices, not over them, with its own Send button (Enter alone was the only way to send).
      const f = Object.assign(document.createElement('form'), { className: 'alert-reply' });
      f.innerHTML = '<input placeholder="Reply…" aria-label="Reply" autocomplete="off" spellcheck="false"><button type="submit" class="primary">Send</button>';
      f.onsubmit = (ev) => { ev.preventDefault(); const t = f.firstChild.value.trim(); if (t) ask({ cmd: 'agent.answer', id, choice: JSON.stringify({ reply: t }) }); };
      b.closest('.acts').before(f);
      b.remove();
      return f.firstChild.focus();
    }

    if (b?.dataset.alertSreply) {

      f.onsubmit = async (ev) => {
        ev.preventDefault();
        const t = input.value.trim();
        if (!t || input.disabled) return;
        input.disabled = true; note.textContent = 'Sending…';
        const why = clSession.error(await clSession.reply(sid, t));
        if (why) { input.disabled = false; note.textContent = 'Not sent: ' + why; return input.focus(); }
        note.textContent = 'Sent.';
        setTimeout(() => { if (keep()) ask({ cmd: 'agent.answer', id, choice: '' }); alert.remove(); }, 3000);

      acts.replaceWith(f);

  const acct = e.target.closest('[data-acct]');

  const mact = e.target.closest('[data-mact]');

  if (collapse) {
    const group = $(collapse.dataset.collapse);
    syncCollapse(group, !group.classList.contains('collapsed'));

// Sections with a [data-collapse] toggle remember being collapsed (per sidebar, in localStorage).
function syncCollapse(group, collapsed) {

}
