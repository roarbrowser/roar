<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<link rel="stylesheet" href="roar.css">
<style>
body { background: var(--ground); display: flex; flex-direction: column; overflow: hidden; user-select: none; }
.top { height: 44px; flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 2px; padding: 0 10px 0 84px; -webkit-app-region: drag; }
.top button { -webkit-app-region: no-drag; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: var(--ink-2); }
.top button:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.top button:disabled { opacity: .35; }
.top svg { width: 15px; height: 15px; }

.address { margin: 2px 10px 10px; height: 34px; border-radius: 9px; background: var(--panel); display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--ink-2); box-shadow: 0 0 0 1px var(--rule); text-align: left; }
.address:hover { color: var(--ink); }
.address .host { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.address svg { width: 13px; height: 13px; flex: none; }

.spaces { display: flex; align-items: center; gap: 2px; }
.spaces:empty { display: none; }
.spaces button { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; }
.spaces button::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); opacity: .5; }
.spaces button:hover::before { opacity: 1; }
.spaces button::before { background: var(--dot, var(--ink-3)); }
.spaces button.dragging { opacity: .3; }
.spaces button.drop-before { box-shadow: -2px 0 0 var(--mane); }
.spaces button.drop-after { box-shadow: 2px 0 0 var(--mane); }
.pin.drop-before { box-shadow: -2px 0 0 var(--mane); }
.pin.drop-after { box-shadow: 2px 0 0 var(--mane); }
.spaces button[aria-pressed="true"]::before { background: var(--dot, var(--mane)); opacity: 1; width: 8px; height: 8px; }
/* A space agents may use: a thin mint ring (the CDP dot's color). */
.spaces button.agents::before { box-shadow: 0 0 0 1.5px var(--ground), 0 0 0 2.5px #7aa898; }
body { box-shadow: inset 3px 0 0 var(--space-color, transparent); }
.resize { position: fixed; top: 0; right: 0; bottom: 0; width: 5px; cursor: col-resize; z-index: 10; }
.space-menu { position: fixed; left: 8px; right: 8px; bottom: 44px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; box-sizing: border-box; padding: 6px; border-radius: 10px; background: var(--ground); box-shadow: 0 0 0 1px var(--rule), 0 8px 24px rgba(0,0,0,.35); z-index: 10; }
.space-menu[hidden] { display: none; }
.space-menu input:focus-visible, .ctx input:focus-visible { outline: 2px solid var(--mane); outline-offset: 1px; }
.space-menu input { width: 100%; min-width: 0; box-sizing: border-box; border: 0; padding: 4px 8px; border-radius: 6px; background: var(--panel); color: var(--ink); font: 500 12.5px var(--ui); }
.space-menu .swatches { grid-column: 1 / -1; display: flex; gap: 6px; padding: 2px 2px 0; }
.foot .space-menu .swatches button { width: 18px; height: 18px; padding: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.foot .space-menu .swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.foot .space-menu #space-remove { width: auto; height: auto; }
.foot .space-menu #space-close { grid-column: 1 / -1; width: auto; height: auto; justify-self: start; }
.foot .space-menu #space-agents { grid-column: 1 / -1; width: auto; height: auto; justify-self: start; display: flex; align-items: center; gap: 6px; }
#space-agents::before { content: ""; width: 10px; height: 10px; border-radius: 3px; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
#space-agents[aria-checked="true"]::before { background: #7aa898; box-shadow: none; }
.space-menu button { white-space: nowrap; padding: 4px 8px; border-radius: 6px; color: var(--ink-2); font-size: 12px; }
.space-menu button:hover { color: var(--ink); background: var(--panel); }
.foot .space-name { color: var(--ink-2); font-size: 11.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }
.scroll { flex: 1; overflow-y: auto; padding: 0 6px 12px; display: flex; flex-direction: column; gap: 14px; }

.pinned { --cols: 5; display: flex; flex-wrap: wrap; gap: 6px; padding: 0 4px; }
.pinned > .pin { flex: 0 0 calc((100% - (var(--cols) - 1) * 6px) / var(--cols)); }
.pinned.centered { justify-content: center; }
.pinned:empty { display: none; }
/* While a tab is dragged, an empty pinned strip shows as a drop zone. */
body.drag-active .pinned:empty { display: flex; height: 38px; margin: 0 4px; padding: 0; border: 1px dashed var(--rule); border-radius: 10px; align-items: center; justify-content: center; }
body.drag-active .pinned:empty::before { content: 'Drop to pin'; color: var(--ink-3); font-size: 12px; }
.pin { min-width: 0; height: 38px; border-radius: 10px; background: var(--hover); display: grid; place-items: center; position: relative; }
.pin:hover { background: var(--rule); }
.pin.active { background: var(--selected); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.pin.active::after { content: ""; position: absolute; bottom: 3px; left: 50%; width: 12px; height: 2px; margin-left: -6px; border-radius: 1px; background: var(--mane); }
.pin .fav.letter { background: none; font-size: 13px; color: var(--ink-2); }
.pin .lion { width: 20px; height: 20px; }
.pin .custom { font-size: 18px; line-height: 1; }
.pin img.custom { width: 22px; height: 22px; border-radius: 5px; object-fit: cover; }

.group-head { display: flex; align-items: center; gap: 6px; padding: 0 8px 4px; color: var(--ink-3); font-size: 12px; font-weight: 600; }
.group-head .count { font-weight: 400; font-variant-numeric: tabular-nums; }
.group-head .spacer { flex: 1; }
.group-head button { font-weight: 500; color: var(--ink-2); padding: 2px 6px; border-radius: 5px; }
.group-head button:hover { background: var(--hover); color: var(--ink); }
.group-head .toggle { display: flex; align-items: center; gap: 4px; padding: 2px 0; color: var(--ink-3); font-weight: 600; }
.group-head .toggle:hover { background: none; color: var(--ink-2); }
.chev { width: 9px; height: 9px; transition: transform .12s; }
.collapsed .chev { transform: rotate(-90deg); }
.collapsed .rows { display: none; }

.rows { display: flex; flex-direction: column; gap: 1px; }
.row { position: relative; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 6px 0 8px; border-radius: 7px; text-align: left; width: 100%; }
.row:hover { background: var(--hover); }
.row.active { background: var(--selected); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.row .label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { color: var(--ink-3); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .x { width: 20px; height: 20px; border-radius: 5px; display: grid; opacity: .8; place-items: center; color: var(--ink-3); flex: none; }
.row:hover .x, .row:focus-within .x { opacity: 1; }
.row .x:hover { background: var(--rule); color: var(--ink); }
.row.cool .label { color: var(--ink-3); }
.row .badge.unsplit { cursor: pointer; } .row .badge.unsplit:hover { color: var(--ink); }
.row .badge { font-size: 10px; color: var(--mane-ink); background: var(--mane-soft); border-radius: 4px; padding: 0 5px; }
/* Cooling bar: what's left before Clean Tabs archives this tab. */
.row .life { position: absolute; left: 34px; right: 10px; bottom: 3px; height: 2px; border-radius: 1px; background: transparent; }
.row .life i { display: block; height: 100%; border-radius: 1px; background: var(--mane); opacity: .55; }
.row.active .life, .row.pinned-row .life { display: none; }

.fav { width: 16px; height: 16px; flex: none; display: grid; place-items: center; border-radius: 4px; overflow: hidden; }
.fav img { width: 16px; height: 16px; }
.fav.letter { background: var(--rule); color: var(--ink-2); font-size: 10px; font-weight: 700; font-family: var(--round); }
/* Ghost tabs: a private, in-memory profile; their own tinted section. */
#ghost-group { margin: 0 0 8px; padding: 2px 0 4px; border-radius: 10px; background: color-mix(in srgb, #6b5ca5 12%, transparent); }
#ghost-group .group-head { color: #6b5ca5; gap: 6px; }
.ghost-ico { width: 13px; height: 13px; flex: none; }
.pin .fav { width: 18px; height: 18px; }
.pin .fav img { width: 18px; height: 18px; }
.spin { width: 16px; height: 16px; flex: none; border-radius: 50%; border: 2px solid var(--rule); border-top-color: var(--mane); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Tab groups: their own section beside Tabs, headed by the group's name. */
.tgroup { margin-bottom: 8px; }
.tgroup .group-head { cursor: default; }
.tgroup .gname { font-weight: 600; }
.tgroup .gdot { width: 8px; height: 8px; border-radius: 50%; background: var(--gc, var(--ink-3)); flex: none; }
.tgroup .gname { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tgroup .gpin { width: 10px; height: 10px; color: var(--ink-3); flex: none; }
.tgroup .rows { margin-left: 6px; padding-left: 6px; box-shadow: inset 2px 0 0 var(--gc, var(--rule)); }
.tgroup.collapsed .rows { display: none; }
.tgroup .empty { color: var(--ink-3); font-size: 12px; padding: 4px 8px; }
.drop-target { background: var(--hover); border-radius: 8px; }
.row.dragging { opacity: .4; }
/* Dropping a tab on another tab splits them; the half under the pointer picks the layout. */
.row.split-drop { position: relative; background: var(--hover); box-shadow: inset 0 0 0 1.5px var(--mane); }
.row.split-drop::after { content: attr(data-split-label); position: absolute; right: 8px; top: 50%; transform: translateY(-50%); padding: 2px 7px; border-radius: 6px; background: var(--mane); color: #2a1604; font: 600 11px var(--ui); pointer-events: none; }
.pin.split-drop { background: var(--hover); box-shadow: inset 0 0 0 1.5px var(--mane); }
.ctx { position: fixed; z-index: 20; min-width: 180px; max-width: 240px; padding: 4px; border-radius: 9px; background: var(--ground); box-shadow: 0 0 0 1px var(--rule), 0 8px 24px rgba(0,0,0,.35); display: flex; flex-direction: column; }
.ctx[hidden] { display: none; }
.ctx button { text-align: left; padding: 5px 8px; border-radius: 6px; color: var(--ink); font-size: 12.5px; display: flex; align-items: center; gap: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctx button:hover { background: var(--hover); }
.ctx hr { border: 0; border-top: 1px solid var(--rule); margin: 4px 2px; }
.ctx .head { color: var(--ink-3); font-size: 11px; padding: 4px 8px 2px; }
.ctx .gdot { width: 8px; height: 8px; border-radius: 50%; background: var(--gc, var(--ink-3)); flex: none; }
.ctx input { margin: 2px; border: 0; padding: 5px 8px; border-radius: 6px; background: var(--panel); color: var(--ink); font: 500 12.5px var(--ui); }
.ctx .swatches { display: flex; gap: 6px; padding: 4px 6px; }
.ctx .swatches button { width: 16px; height: 16px; padding: 0; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.ctx .swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }

.note { color: var(--ink-3); font-size: 12px; padding: 2px 8px 4px; }
.note code { font: 11px var(--mono); }
.pr .label { display: flex; flex-direction: column; line-height: 1.2; }
.pr .label small { color: var(--ink-3); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.pr { height: 40px; }
.pr .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; margin: 0 4px; }
.mail .dot { background: var(--acct, #d9822b); }
/* Agent sessions: the dot says working (pulsing), needs you (orange, the row pulses) or idle;
   the same state is in the row's text for screen readers. */
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.cl .dot.idle { background: var(--ink-3); } .cl .dot.needs_you { background: var(--mane, #d9822b); }
/* Still, never blinking: a tinted row and an orange dot say a session needs you. */
.cl .dot.working, .cl .dot.starting { background: var(--ok); }
.cl.needs { background: var(--mane-soft, rgba(217,130,43,.18)); }
/* Two lines per session: name and age, then what it's doing (wraps to two lines, never mid-word
   on one). Actions float over the right edge on hover, so they never take width from the text. */
.cl.pr { height: auto; min-height: 44px; padding-block: 7px; align-items: flex-start; }
.cl .clmain { align-items: flex-start; }
.cl .label { white-space: normal; overflow: visible; gap: 2px; }
.cl .cl-name { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.cl .cl-name b { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cl .cl-name time { flex: none; color: var(--ink-3); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.cl .label small { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: normal; overflow: hidden; line-height: 1.3; overflow-wrap: anywhere; }
.cl.needs .label small { color: var(--ink-2); }
.cl-ic { position: relative; flex: none; width: 16px; height: 16px; margin-top: 1px; }
.cl-ic .agent-icon { display: block; }
.cl-ic .dot { position: absolute; right: -3px; bottom: -3px; width: 7px; height: 7px; margin: 0; box-shadow: 0 0 0 2px var(--ground); }
.cl-acts { position: absolute; top: 5px; right: 4px; display: flex; gap: 1px; padding-left: 14px; opacity: 0; pointer-events: none; transition: opacity .12s ease-out;
  background: linear-gradient(to right, transparent, var(--ground) 14px); }
.cl:hover .cl-acts, .cl:focus-within .cl-acts { opacity: 1; pointer-events: auto; }
.cl:hover .cl-name time, .cl:focus-within .cl-name time { visibility: hidden; }
.cl-acts button { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; color: var(--ink-2); }
.cl-acts button:hover { background: var(--hover); color: var(--ink); }
.cl-acts button[aria-disabled=true] { opacity: .35; cursor: default; }
.cl-acts button[aria-pressed=true] { color: var(--mane, #d9822b); }
.cl .cl-reply { align-self: flex-start; margin-top: 4px; padding: 2px 8px; border-radius: 999px; font: 600 11px var(--ui); background: var(--mane-soft, rgba(217,130,43,.18)); color: var(--mane, #d9822b); }
.af-row { width: 100%; } .af-row .agent-icon { color: var(--ink-2); }
.cl .clmain { display: flex; align-items: flex-start; gap: 8px; flex: 1; min-width: 0; height: 100%; text-align: left; cursor: pointer; }
.cl { cursor: pointer; }
.cl.starting { cursor: default; opacity: .8; }
/* A session that needs you: one reply line under its row (the full view has everything else). */
.clq { position: relative; margin: 0 4px 8px 30px; }
.gh-q { display: flex; gap: 4px; padding: 0 10px 8px; }
.gh-q input { flex: 1; min-width: 0; font: 11.5px var(--mono); padding: 4px 7px; border-radius: 6px; border: 1px solid var(--rule); background: var(--ground); color: var(--ink); }
.gh-q button { color: var(--ink-2); padding: 0 6px; font-size: 11.5px; }
.clq input { width: 100%; box-sizing: border-box; padding: 7px 60px 7px 9px; border: 0; border-radius: 6px; background: var(--ground); color: var(--ink); font: 12px var(--ui); box-shadow: inset 0 0 0 1px var(--rule); }
.clq .clq-acts { position: absolute; top: 3px; right: 3px; bottom: 3px; display: flex; gap: 2px; }
.clq button { width: 26px; display: grid; place-items: center; border-radius: 5px; color: var(--ink-2); }
.clq button:hover { background: var(--hover); color: var(--ink); }
.clq .send { background: var(--mane, #d9822b); color: #2a1604; } .clq .send:hover { background: var(--mane, #d9822b); color: #2a1604; filter: brightness(1.08); }
.clq button:disabled, .clq button[aria-disabled=true] { opacity: .5; cursor: default; }
.group-head button[aria-disabled=true] { opacity: .45; cursor: default; }
#cl-group { margin-top: 8px; }
#cl-group .group-head { gap: 2px; } #cl-group .group-head button { white-space: nowrap; flex: none; }
#cl-group .group-head .toggle { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; } #cl-group .group-head .count { margin-left: 4px; } #cl-group .toggle .chev { flex: none; }
.feed[aria-pressed="true"] { background: var(--hover); }
/* New session: a centered modal, type first, then where. */
.cld { width: calc(100% - 24px); max-width: 320px; padding: 14px; border: 0; border-radius: 12px; background: var(--ground); color: var(--ink); box-shadow: 0 0 0 1px var(--rule), 0 12px 32px rgba(0,0,0,.4); font-size: 12.5px; }
.cld::backdrop { background: rgba(0,0,0,.35); }
.cld h2 { margin: 0 0 10px; font-size: 13.5px; font-weight: 600; }
.cld form { display: grid; gap: 10px; }
.cld legend { padding: 0 0 6px; color: var(--ink-3); font-size: 11.5px; font-weight: 600; }
.cld .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
.cld .opt { position: relative; display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--rule); cursor: pointer; min-width: 0; }
.cld .tiles .opt { flex-direction: column; gap: 6px; padding: 10px 6px; text-align: center; }
.cld .opt span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cld .opt small { display: block; color: var(--ink-3); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.cld .opt:hover { background: var(--hover); }
.cld .opt input { position: absolute; opacity: 0; pointer-events: none; }
.cld .opt:has(:checked) { background: var(--mane-soft, rgba(217,130,43,.18)); box-shadow: inset 0 0 0 1.5px var(--mane, #d9822b); }
.cld .opt:has(:focus-visible) { outline: 2px solid var(--mane, #d9822b); outline-offset: 1px; }
.cld .where { display: grid; gap: 4px; max-height: 40vh; overflow: auto; }
.cld .pick { justify-self: start; padding: 5px 10px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--rule); }
.cld textarea { width: 100%; box-sizing: border-box; resize: none; height: 58px; padding: 6px 8px; border: 0; border-radius: 6px; background: var(--panel); color: var(--ink); font: 12.5px var(--ui); box-shadow: inset 0 0 0 1px var(--rule); }
.cld .opt.tab { padding: 5px 8px; gap: 7px; } .cld .opt.tab img, .cld .opt.tab svg { width: 14px; height: 14px; flex: none; }
#cl-step3 { display: grid; gap: 10px; } #cl-step3[hidden] { display: none; }
#cl-tabs { max-height: 22vh; }
.cld .acts { display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
.cld .acts span { flex: 1; color: var(--ink-3); }
.cld .acts button { padding: 5px 12px; border-radius: 6px; } .cld .acts button:hover { background: var(--hover); }
.cld .go { background: var(--mane, #d9822b); color: #2a1604; font-weight: 600; } .cld .go:hover { background: var(--mane, #d9822b); filter: brightness(1.06); } .cld .go:disabled { opacity: .5; filter: none; }
.cld button:focus-visible, .cld textarea:focus-visible, .cld textarea:focus { outline: 2px solid var(--mane, #d9822b); outline-offset: 1px; }
.feed .badge.urgent { background: #d9822b; box-shadow: 0 0 0 2px var(--ground); }
.mailrow { position: relative; }
.macts { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); display: none; gap: 2px; padding: 2px; border-radius: 7px; background: var(--ground); box-shadow: 0 0 0 1px var(--rule); }
.mailrow:hover .macts, .mailrow:focus-within .macts { display: flex; }
.msel { flex: none; margin: 0 2px 0 8px; accent-color: var(--acct, #d9822b); }
.mailrow:has(.msel) { display: flex; align-items: center; }
.mailrow .row { flex: 1; min-width: 0; }
.acct-head { cursor: pointer; }
.acct-head:hover .who { text-decoration: underline; }
.macts button { width: 24px; height: 24px; border-radius: 5px; font-size: 12px; line-height: 1; color: var(--ink-2); }
.macts button:hover { background: var(--hover); color: var(--ink); }
/* One section per Gmail account when a space has several; the account's hue
   marks its header swatch and every message dot under it. */
.acct-head { position: sticky; top: -4px; z-index: 1; display: flex; align-items: center; gap: 8px; margin: 6px 0 2px; padding: 7px 8px 5px; background: var(--ground); border-top: 1px solid var(--rule); font-size: 12px; }
.acct:first-child .acct-head { margin-top: 0; border-top: 0; }
.acct-head .swatch { width: 10px; height: 10px; border-radius: 3px; background: var(--acct); flex: none; }
.acct-head .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); font-weight: 600; }
.acct-head .who span { color: var(--ink-3); font-weight: 400; }
.acct-head .n { margin-left: auto; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.acct .note { padding-left: 26px; }

.foot { flex: none; display: flex; align-items: center; gap: 7px; padding: 8px 14px 12px; color: var(--ink-3); font-size: 11px; border-top: 1px solid var(--rule); }
.foot .wordmark { font-size: 15px; color: var(--ink-2); }
.foot .brand { display: grid; grid-template-columns: auto auto; align-items: center; column-gap: 7px; }
.foot .brand .space-name { grid-column: 1 / -1; line-height: 1.2; margin-top: 2px; }
.foot .tools { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.foot .brand .space-name:empty { display: none; }
/* CDP: a filled mint dot (not a space color) while open, hollow while closed. */
.foot .cdp { width: 7px; height: 7px; flex: none; padding: 0; border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.foot .cdp.on { background: #7aa898; box-shadow: none; }
.foot .cdp:hover { background: var(--hover); box-shadow: inset 0 0 0 1.5px var(--ink-2); }
.foot .cdp.on:hover { background: #7aa898; box-shadow: 0 0 0 2px var(--hover); }
.foot .spacer { flex: 1; }
.foot button { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--ink-3); }
.foot button:hover { background: var(--hover); color: var(--ink); }
.foot svg { width: 14px; height: 14px; }
#settings { background: none; }
#settings .knob { fill: var(--ground); transition: fill .15s, stroke .15s; }
#settings:hover { background: none; color: var(--ink-2); }
#settings:hover .knob, #settings:focus-visible .knob { fill: var(--mane); stroke: var(--mane); }
#settings:focus-visible { outline: 2px solid var(--mane); outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) { #settings .knob { transition: none; } }
.bar { flex: none; display: flex; align-items: center; gap: 4px; padding: 6px 10px; }
/* Agent alerts (MCP notify_user / ask_user): newest at the bottom, nearest the footer;
   the left edge says how much it needs you. */
.alerts { flex: none; display: flex; flex-direction: column; gap: 10px; max-height: 45vh; overflow-y: auto; padding: 4px 10px 10px; }
.alert { flex: none; }
.alerts:empty { display: none; }
.alert { --edge: var(--ink-3); position: relative; padding: 9px 30px 10px 12px; border-radius: 10px; background: var(--ground); box-shadow: inset 3px 0 0 var(--edge), 0 0 0 1px var(--rule); font-size: 12.5px; }
.alert.done { --edge: var(--ok); }
.alert.needs_you { --edge: var(--mane); }
.alert .who { color: var(--ink-3); font-size: 11px; display: flex; gap: 6px; }
.alert .t { color: var(--ink); font-weight: 650; margin-top: 2px; line-height: 1.3; }
.alert .b { color: var(--ink-2); margin-top: 3px; line-height: 1.4; white-space: pre-wrap; }
.alert:not(.full) .b { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.alert .more { font-size: 11.5px; color: var(--ink-3); padding: 2px 0; } .alert .more:hover { color: var(--ink); }
.alert .acts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.alert .acts:empty { display: none; }
.alert .acts button { padding: 4px 10px; border-radius: 6px; background: var(--hover); color: var(--ink); font: 500 12px var(--ui); }
.alert .acts button:hover { filter: brightness(.97); }
.alert .acts button.primary { background: var(--mane); color: #2a1604; font-weight: 600; }
.alert .dismiss { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; color: var(--ink-3); }
.alert .dismiss:hover { background: var(--hover); color: var(--ink); }
.alert .gone { color: var(--ink-3); font-size: 11.5px; margin-top: 6px; font-style: italic; }
.alerts .clear-all { align-self: flex-end; font-size: 11px; color: var(--ink-3); padding: 2px 4px; }
.alerts .clear-all:hover { color: var(--ink); }
.bar .spacer { flex: 1; }
.bar:not(:has(.ext-pins:not(:empty), .feed:not([hidden]), .dlbtn:not([hidden]))) { display: none; }
.dlbtn { position: relative; width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: var(--ink-2); }
.dlbtn:hover { background: var(--hover); color: var(--ink); }
.dlbtn[hidden] { display: none; }
.dlbtn svg { width: 16px; height: 16px; }
.dlbtn .badge { position: absolute; top: 0; right: -2px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; background: var(--mane); color: #fff; font: 600 9.5px/14px var(--ui); text-align: center; }
.dlbtn .badge:empty { display: none; }
/* Sound: shows while a tab plays audio (or is muted); click to mute. */
.row .snd { width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; color: var(--mane-ink); flex: none; }
.row .snd:hover { background: var(--rule); }
.row .snd.muted { color: var(--ink-3); }
.snd svg { width: 13px; height: 13px; }
.pin .snd { position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; color: var(--mane-ink); background: var(--panel); }
.pin .snd.muted { color: var(--ink-3); }
.pin .snd svg { width: 10px; height: 10px; }
.ext-pins { display: flex; flex-wrap: wrap; gap: 4px; }
.feed { position: relative; width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; }
.feed:hover, .feed[aria-expanded="true"] { background: var(--hover); }
.feed[hidden] { display: none; }
.feed svg { width: 16px; height: 16px; color: var(--ink-2); }
.feed .badge { position: absolute; top: 0; right: -2px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; background: var(--mane, #d9822b); color: #fff; font: 600 9.5px/14px var(--ui); text-align: center; }
.feed .badge:empty, .no-counts .feed .badge { display: none; }
.feed-pop { display: none; position: fixed; z-index: 15; left: 8px; right: 8px; bottom: 96px; max-height: 60vh; overflow: auto; padding: 4px; border-radius: 10px; background: var(--ground); box-shadow: 0 0 0 1px var(--rule), 0 8px 24px rgba(0,0,0,.35); }
.feed-pop.open { display: block; }
.group-head .af-btn { display: grid; place-items: center; padding: 3px 5px; } .group-head .af-btn[hidden] { display: none; } .group-head .af-btn[aria-disabled=true] { opacity: .45; } .group-head .af-btn[aria-pressed=false] { color: var(--ink-3); } .af-btn svg { width: 14px; height: 14px; } .af-btn[aria-expanded="true"] { background: var(--hover); color: var(--ink); }
.ext-pins button { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; }
.ext-pins button:hover { background: var(--hover); }
.ext-pins img { width: 18px; height: 18px; }
.ext-pins button { position: relative; }
.ext-pins .badge { position: absolute; right: 0; bottom: 0; min-width: 12px; height: 12px; padding: 0 2px; border-radius: 6px; background: var(--mane); color: #fff; font-size: 8px; font-weight: 700; line-height: 12px; text-align: center; pointer-events: none; }
.ext-pins .letter { font-size: 12px; font-weight: 600; color: var(--ink-2); }
</style>
</head>

<script>
const $ = (id) => document.getElementById(id);
const SPEAKER = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.3 3.7a6 6 0 0 1 0 8.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
const SPEAKER_OFF = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="m10.5 6 4 4m0-4-4 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
const sndButton = (t, cls) => (t.audible || t.muted)
  ? `<button class="${cls} snd${t.muted ? ' muted' : ''}" data-mute="${t.id}" title="${t.muted ? 'Unmute tab' : 'Mute tab'}" aria-label="${t.muted ? 'Unmute tab' : 'Mute tab'}">${t.muted ? SPEAKER_OFF : SPEAKER}</button>` : '';
const x = '<svg viewBox="0 0 12 12" width="10" height="10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m3 3 6 6M9 3l-6 6"/></svg>';
let state = null;

function ago(seconds) {
  if (seconds < 3600) return Math.max(1, Math.round(seconds / 60)) + 'm';
  if (seconds < 86400) return Math.round(seconds / 3600) + 'h';
  return Math.round(seconds / 86400) + 'd';
}

function tabRow(t, limit) {
  const left = limit > 0 ? Math.max(0, 1 - t.idleSeconds / limit) : 1;
  const cool = limit > 0 && left < 0.25 && !t.active;
  const remaining = limit > 0 ? `Archives in ${ago(Math.max(60, limit - t.idleSeconds))}` : '';
  return `<div class="row${t.active ? ' active' : ''}${cool ? ' cool' : ''}" data-id="${t.id}" draggable="true" title="${esc(t.title)}\n${esc(t.url)}${remaining && !t.active ? '\n' + remaining : ''}">
    ${t.loading ? '<span class="spin"></span>' : t.url.startsWith('roar:') ? '<span class="lion" style="width:16px;height:16px"></span>' : iconHtml(t.favicon, t.url)}
    <span class="label">${esc(t.title || hostOf(t.url))}</span>
    ${t.floating ? '<span class="badge">floating</span>' : ''}${t.split ? `<button class="badge unsplit" data-unsplit="${t.id}" title="Separate tabs">split ×</button>` : ''}
    ${sndButton(t, '')}
    <button class="x" data-close="${t.id}" aria-label="Close tab">${x}</button>
    ${limit > 0 && !t.active ? `<span class="life"><i style="width:${(left * 100).toFixed(1)}%"></i></span>` : ''}
  </div>`;
}

window.roar = {
  render(s) {
    state = s;
    const limit = s.settings.archiveAfterHours * 3600;
    const ghosts = s.tabs.filter((t) => t.ghost);
    // A Claude session in full view is shown by its session row, not as a tab.
    const clFull = {};
    for (const t of s.tabs) { const m = /^roar:\/\/ui\/claude\.html\?id=([\w-]+)/.exec(t.url || ''); if (m) clFull[m[1]] = t; }
    s = { ...s, tabs: s.tabs.filter((t) => !t.ghost && !/^roar:\/\/ui\/claude\.html/.test(t.url || '')) };
    const pinned = s.tabs.filter((t) => t.pinned);
    const open = s.tabs.filter((t) => !t.pinned && !t.group);  // Mail/PR tabs too: everything opened is a real tab.
    $('ghost-group').hidden = !ghosts.length;
    setHtml($('ghost-tabs'), ghosts.map((t) => tabRow(t, 0)).join(''));
    $('ghost-count').textContent = ghosts.length || '';
    const folderTab = (f) => s.tabs.find((t) => t.folder === f && !t.pinned && !t.group);
    // The folder's tab stands in for the link it opened; elsewhere it leads the list.
    const folderRows = (f, items, row) => {
      const ft = folderTab(f);
      const at = ft ? items.findIndex((i) => i.url === ft.folderItem) : -1;
      return (ft && at < 0 ? tabRow(ft, 0) : '') + items.map((i, n) => n === at ? tabRow(ft, 0) : row(i)).join('');
    };
    const groupHtml = (g) => {
      const tabs = s.tabs.filter((t) => t.group === g.id);
      return `<section class="tgroup${g.collapsed ? ' collapsed' : ''}" data-group="${g.id}" style="${g.color ? '--gc:' + g.color : ''}">
        <div class="group-head" data-group-head="${g.id}"><button class="toggle" data-group-toggle="${g.id}" aria-label="${g.collapsed ? 'Expand' : 'Collapse'} group ${esc(g.name)}" aria-expanded="${!g.collapsed}"><svg class="chev" viewBox="0 0 10 10" fill="currentColor"><path d="M1 3h8L5 8z"/></svg></button><span class="gdot"></span><span class="gname">${esc(g.name)}</span><span class="count">${tabs.length || ''}</span>${g.pinned ? '<svg class="gpin" viewBox="0 0 16 16" fill="currentColor"><path d="M9.8 1.5 14.5 6.2l-1.4.4-3 3 .1 3-1.2 1.2-2.6-2.6L3 14.6 1.4 13l3.4-3.4-2.6-2.6L3.4 5.8l3 .1 3-3z"/></svg>' : ''}</div>
        <div class="rows">${tabs.map((t) => tabRow(t, g.pinned ? 0 : limit)).join('') || '<div class="empty">Drag tabs here</div>'}</div>
      </section>`;
    };
    const groups = s.groups || [];
    setHtml($('pinned-groups'), groups.filter((g) => g.pinned).map(groupHtml).join(''));
    setHtml($('groups'), groups.filter((g) => !g.pinned).map(groupHtml).join(''));
    // Spaces stay out of the way: only a name and dots in the footer, and
    // nothing at all until a second space exists.
    const multi = s.spaces.length > 1;
    const cur = s.spaces.find((sp) => sp.id === s.activeSpace);
    document.body.style.setProperty('--space-color', cur?.color || 'transparent');
    $('space-name').style.color = cur?.color || '';

document.addEventListener('click', (e) => {
  const alert = e.target.closest('[data-alert]');
  if (alert) {
    const id = +alert.dataset.alert, b = e.target.closest('button');
    if (b?.dataset.alertChoice !== undefined) return ask({ cmd: 'agent.answer', id, choice: b.dataset.alertChoice });
    if (b?.dataset.alertOpen) { ask({ cmd: 'open', text: b.dataset.alertOpen, newTab: true, ...(+b.dataset.alertSpace >= 0 ? { space: +b.dataset.alertSpace } : {}) }); return ask({ cmd: 'agent.answer', id, choice: 'opened' }); }
    if (b?.hasAttribute('data-alert-dismiss')) return ask({ cmd: 'agent.answer', id, choice: '' });
    if (b?.hasAttribute('data-alert-more')) { const full = alert.classList.toggle('full'); b.textContent = full ? 'less' : 'more'; b.setAttribute('aria-expanded', full); }
    return;
  }
  if (e.target.closest('[data-alert-clear]')) return ask({ cmd: 'agent.clear' });
  const space = e.target.closest('[data-space]');
  if (space) return ask({ cmd: 'space.switch', id: +space.dataset.space });
  const toggle = e.target.closest('[data-group-toggle], [data-group-head]');
  if (toggle && !e.target.closest('.ctx')) {
    const g = state.groups.find((g) => g.id === +(toggle.dataset.groupToggle || toggle.dataset.groupHead));
    if (g) return ask({ cmd: 'group.update', id: g.id, collapsed: !g.collapsed });
  }
  const mute = e.target.closest('[data-mute]');
  if (mute) { e.stopPropagation(); return ask({ cmd: 'tab.mute', id: +mute.dataset.mute }); }
  if (e.target.closest('[data-agentmd]')) return ask({ cmd: 'run', id: 'agentmd' });
  if (e.target.closest('#dl-btn')) return ask({ cmd: 'run', id: 'downloads' });
  const close = e.target.closest('[data-close]');
  if (close) { e.stopPropagation(); return ask({ cmd: 'tab.close', id: +close.dataset.close }); }
  const tab = e.target.closest('[data-id]');
  if (tab) return ask({ cmd: 'tab.activate', id: +tab.dataset.id });
  const acct = e.target.closest('[data-acct]');
  if (acct) return ask({ cmd: 'open', text: `https://mail.google.com/mail/u/${acct.dataset.acct}/`, newTab: true });

  }

  $('cl-note').textContent = 'Starting…';
  await ask({ cmd: 'settings.set', settings: { agentTool: tool } });  // claude-ctl new starts the saved CLI.
  clWant = { dir: scratch ? '' : where, tool, name: scratch ? prompt.replace(/\s+/g, ' ').slice(0, 60) || 'Scratch' : where.split('/').pop(), since: Date.now() - 2000 };
  ask({ cmd: 'state' }).then(roar.render);
  const out = await ask({ cmd: 'claude.ctl', action: 'new', id: scratch ? '' : where, scratch, text: prompt, tabs });
  if (out.startsWith('error: ')) { clWant = null; ask({ cmd: 'state' }).then(roar.render); return void ($('cl-note').textContent = out.slice(7)); }
  if (scratch) clWant = null;  // Its stand-in row (or the hook's) is already there.
  clDlg.close();
  ask({ cmd: 'state' }).then(roar.render);
};
// Header Send tab: straight to the only live session, else a short list to pick from.
$('ask-llm').onclick = () => {
  if ($('ask-llm').getAttribute('aria-disabled') !== 'true') ask({ cmd: 'run', id: 'askLlm:' + $('ask-llm').dataset.llm });
};
$('cl-sendtab').onclick = (e) => {
  e.stopPropagation();
  if ($('cl-sendtab').getAttribute('aria-disabled') === 'true') return;
  if (clLive.length === 1) return clOpenSend(clLive[0].id);
  const r = $('cl-sendtab').getBoundingClientRect();
  showCtx(`<div class="head">Send this tab to</div>${clLive.map((c) => `<button data-act="send" data-id="${esc(c.id)}">${agentIcon(c, 14)}${esc(c.project)}</button>`).join('')}`,
    { clientX: r.left, clientY: r.bottom + 4 }, (act, d) => { hideCtx(); clOpenSend(d.id); });
};
// Opens (or closes) the Send tab prompt box under a session's row.
function clOpenSend(id) {
  clSendOpen = clSendOpen === id ? null : id;
  clReplyOpen = null;
  return ask({ cmd: 'state' }).then(roar.render).then(() => $('cl').querySelector(`[data-clsq="${CSS.escape(clSendOpen || '')}"] input`)?.focus());
}
$('af-btn').onclick = (e) => {
  e.stopPropagation();
  ask({ cmd: 'settings.set', settings: { agentFilesRow: state?.settings?.agentFilesRow === false } });
};
$('cl-btn').onclick = (e) => {
  e.stopPropagation();
  ask({ cmd: 'settings.set', settings: { agentSection: state?.settings?.agentSection === false } });
};
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-unsplit]');
  if (!b) return;
  e.stopPropagation();
  ask({ cmd: 'tab.unsplit', id: +b.dataset.unsplit || 0 });
}, true);
document.addEventListener('click', (e) => {
  const rp = e.target.closest('[data-clreply]');
  if (rp) {
    e.stopPropagation();
    clReplyOpen = clReplyOpen === rp.dataset.clreply ? null : rp.dataset.clreply;
    return ask({ cmd: 'state' }).then(roar.render).then(() => $('cl').querySelector(`[data-clq="${CSS.escape(clReplyOpen || '')}"] input`)?.focus());
  }
  // Same as turning off the {} button in the header.
  if (e.target.closest('[data-afhide]')) { e.stopPropagation(); return ask({ cmd: 'settings.set', settings: { agentFilesRow: false } }); }
  const x = e.target.closest('[data-cldismiss]');
  if (x) { e.stopPropagation(); return ask({ cmd: 'claude.dismiss', id: x.dataset.cldismiss }); }
  const t = e.target.closest('[data-clsend]');
  if (t) { e.stopPropagation(); return t.getAttribute('aria-disabled') === 'true' || clOpenSend(t.dataset.clsend); }
  const sb = e.target.closest('[data-clbeside]');
  if (sb) { e.stopPropagation(); return ask({ cmd: 'claude.beside', id: sb.dataset.clbeside }); }
  const f = e.target.closest('[data-clfocus]');
  if (f) { e.stopPropagation(); return ask({ cmd: 'claude.ctl', action: 'focus', id: f.dataset.clfocus }); }
  if (e.target.closest('[data-clsq]')) return e.stopPropagation();
  const q = e.target.closest('[data-clq]');
  if (q) {
    e.stopPropagation();
    if (e.target.closest('[data-tab]:not([aria-disabled=true])')) ask({ cmd: 'claude.sendTab', id: q.dataset.clq });
    return;
  }
  const r = e.target.closest('[data-clid]');
  if (!r) return;
  e.stopPropagation();
  for (const p of document.querySelectorAll('.feed-pop')) p.classList.remove('open');
  syncFeeds();
  // Every row opens its session: the full-view tab if it's open, else a new one.
  if (r.dataset.cltab) return ask({ cmd: 'tab.activate', id: +r.dataset.cltab });
  return ask({ cmd: 'open', text: 'roar://ui/claude.html?id=' + encodeURIComponent(r.dataset.clid), newTab: true });
}, true);
$('gm-refresh').onclick = () => ask({ cmd: 'run', id: 'gmail' });
// Multi-select delete: ticked messages go to Gmail in one Delete per account.
const mailSel = new Set();
function syncMailSel() {
  $('gm-delsel').hidden = !mailSel.size;
  $('gm-delsel').textContent = `Delete ${mailSel.size}`;
  const items = state?.gmail?.items || [];
  const all = items.length > 0 && items.every((m) => mailSel.has(m.url));
  $('gm-selall').hidden = !items.length;
  $('gm-selall').textContent = all ? 'Select none' : 'Select all';
}
$('gm-selall').onclick = (e) => {
  e.stopPropagation();
  const items = state.gmail.items || [];
  const all = items.every((m) => mailSel.has(m.url));
  for (const m of items) all ? mailSel.delete(m.url) : mailSel.add(m.url);
  for (const box of document.querySelectorAll('#gm .msel')) box.checked = !all;
  syncMailSel();
};
$('gm').addEventListener('change', (e) => {
  const box = e.target.closest('.msel');
  if (!box) return;
  const url = box.closest('[data-murl]').dataset.murl;
  box.checked ? mailSel.add(url) : mailSel.delete(url);
  syncMailSel();
});
$('gm-delsel').onclick = async (e) => {
  e.stopPropagation();
  const byAcct = {};
  for (const m of state.gmail.items) if (mailSel.has(m.url)) (byAcct[m.account || 0] ||= []).push(m.url);
  mailSel.clear();
  syncMailSel();
  for (const m of document.querySelectorAll('#gm .msel')) m.checked = false;
  // shortcut: accounts share one Gmail tab, so wait out each run (~35 s after a load) before the next; a queue in Roar would be faster.
  const batches = Object.values(byAcct);
  for (const [i, urls] of batches.entries()) {
    if (i) await new Promise((r) => setTimeout(r, 45000));
    ask({ cmd: 'mail.act', action: 'delete', url: urls[0], urls });
  }
};
$('hide-sidebar').onclick = () => ask({ cmd: 'run', id: 'sidebar' });
// Pinned extensions: click opens the extension's popup page in a bubble beside
// the button (an options-only extension opens in a tab); right-click unpins. Pin from the Extensions menu in the menu bar.
let pinKey = null;
// Tiles per row comes from settings, or as many 38px tiles as fit.
let pinSettings = {};
function layoutPins(settings) {
  if (settings) pinSettings = settings;
  const el = $('pinned');
  const fit = Math.max(1, Math.floor((el.clientWidth - 8 + 6) / (38 + 6)));
  el.style.setProperty('--cols', pinSettings.pinnedColumns || fit);
  el.classList.toggle('centered', !!pinSettings.pinnedCentered);
}
addEventListener('resize', () => layoutPins());

function loadPins() {
  const key = state.activeSpace + ':' + state.settings.pinnedExtensions.join(',');
  if (key === pinKey) return;
  pinKey = key;
  if (!state.settings.pinnedExtensions.length) return void ($('ext-pins').innerHTML = '');
  ask({ cmd: 'extensions.list' }).then((r) => {
    const list = (typeof r === 'string' ? JSON.parse(r) : r).filter((x) => x.pinned);
    $('ext-pins').innerHTML = list.map((x) => `<button data-ext-open="${esc(x.open)}" data-ext-pin="${esc(x.id)}" ${x.popup ? 'data-ext-popup="1"' : ''} title="${esc(x.name)}">${/^data:image\//.test(x.icon || '') ? `<img src="${esc(x.icon)}" data-default="${esc(x.icon)}" alt="">` : `<span class="letter">${esc(x.name[0] || '?')}</span>`}</button>`).join('');
    ask({ cmd: 'extensions.actions' }).then((a) => roar.actions(typeof a === 'string' ? JSON.parse(a) : a));
  }).catch(() => { pinKey = null; });
}
// Live icon and badge per extension for the active tab (action_watch.cc).
roar.actions = (all) => {
  for (const b of $('ext-pins').querySelectorAll('[data-ext-pin]')) {
    const a = all[b.dataset.extPin] || {};
    const img = b.querySelector('img');
    if (img) img.src = /^data:image\//.test(a.icon || '') ? a.icon : img.dataset.default;
    let badge = b.querySelector('.badge');
    if (!a.badge) { badge?.remove(); continue; }
    if (!badge) b.append(badge = Object.assign(document.createElement('span'), { className: 'badge' }));
    badge.textContent = a.badge;
    badge.style.background = a.color || '';
  }
};
const render0 = roar.render;
roar.render = (s) => { render0(s); loadPins(); };
$('ext-pins').onclick = (e) => {
  const b = e.target.closest('[data-ext-open]');
  if (!b) return;
  e.stopPropagation();
  const r = b.getBoundingClientRect();
  if (b.dataset.extPopup) ask({ cmd: 'extensions.popup', url: b.dataset.extOpen, x: Math.round(r.right + 6), y: Math.round(r.top) });
  else ask({ cmd: 'open', text: b.dataset.extOpen, newTab: true });
};
$('ext-pins').oncontextmenu = (e) => {
  const b = e.target.closest('[data-ext-pin]');
  if (b) { e.preventDefault(); e.stopPropagation(); ask({ cmd: 'run', id: 'extensionPin:' + b.dataset.extPin }); }
};
$('settings').onclick = () => ask({ cmd: 'run', id: 'settings' });
// The agent count is looked up as the pointer arrives, before the tooltip shows.
$('cdp').onmouseenter = () => ask({ cmd: 'cdp.clients' }).then((n) => {
  if (!state) return;
  n = +n || 0;
  $('cdp').title = `CDP: ${state.settings.cdpPort} ${state.settings.cdpOn ? 'open' : 'closed'}` +
    (state.settings.cdpOn ? ` · ${n} agent${n === 1 ? '' : 's'} connected` : '') + agentSpaces(state);
});
// The dot switches agents for this space only; the port itself lives in Settings.
$('cdp').onclick = () => {
  const on = !(state.settings.cdpOn && spaceAgents(state));
  (on && !state.settings.cdpOn ? ask({ cmd: 'settings.set', settings: { cdpEnabled: true } }) : Promise.resolve())
    .then(() => ask({ cmd: 'space.agents', id: state.activeSpace, on }))
    .then(() => ask({ cmd: 'state' })).then(roar.render);
};
// GitHub PRs and Unread mail open as popovers from their footer icons.
function syncFeeds() {
  const bar = $('bar').getBoundingClientRect();
  for (const b of document.querySelectorAll('.feed[data-feed]')) {
    const pop = $(b.dataset.feed);
    b.setAttribute('aria-expanded', pop.classList.contains('open'));
    pop.style.bottom = (innerHeight - bar.top + 4) + 'px';
  }
}
$('bar').addEventListener('click', (e) => {
  const b = e.target.closest('[data-feed]');
  if (!b) return;
  e.stopPropagation();
  if (b.id === 'gm-btn' || b.id === 'gh-btn') ask({ cmd: 'run', id: b.id === 'gm-btn' ? 'gmail' : 'github' });  // Live update on every click.
  const pop = $(b.dataset.feed), open = !pop.classList.contains('open');
  for (const p of document.querySelectorAll('.feed-pop')) p.classList.remove('open');
  pop.classList.toggle('open', open);
  syncFeeds();
  // Keyboard users land inside the popover, and Escape brings them back to its icon.
  if (open) (pop.querySelector('button, input, [tabindex]') || pop).focus();
});
document.addEventListener('click', (e) => {
  if (e.target.closest('.feed-pop') && !e.target.closest('[data-url]')) return;
  for (const p of document.querySelectorAll('.feed-pop')) p.classList.remove('open');
  syncFeeds();
});
addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const open = document.querySelector('.feed-pop.open');
  for (const p of document.querySelectorAll('.feed-pop')) p.classList.remove('open');
  syncFeeds();
  if (open) document.querySelector(`[data-feed="${open.id}"]`)?.focus();
});
const COLORS = ['', '#e5484d', '#f76b15', '#ffc53d', '#46a758', '#12a594', '#0090ff', '#8e4ec6', '#d6409f'];
const COLOR_NAMES = { '#e5484d': 'Red', '#f76b15': 'Orange', '#ffc53d': 'Yellow', '#46a758': 'Green', '#12a594': 'Teal', '#0090ff': 'Blue', '#8e4ec6': 'Purple', '#d6409f': 'Pink' };
function renderSwatches() {
  const sp = state?.spaces.find((x) => x.id === menuSpace);
  $('swatches').innerHTML = COLORS.map((c) => `<button data-color="${c}" aria-pressed="${(sp?.color || '') === c}" title="${c || 'Default'}" style="background:${c || 'var(--ink-3)'}"></button>`).join('');
}
$('swatches').addEventListener('mousedown', (e) => e.preventDefault());
$('swatches').addEventListener('click', (e) => {
  const b = e.target.closest('[data-color]');
  if (!b) return;
  e.stopPropagation();
  ask({ cmd: 'space.color', id: menuSpace, color: b.dataset.color }).then(() => ask({ cmd: 'state' })).then((s) => { roar.render(s); renderSwatches(); });
});
ask({ cmd: 'state' }).then((s) => roar.render(s)).catch(() => {});

// Drag the right edge to resize the sidebar; Roar saves the width.
$('resize').addEventListener('mousedown', (e) => {
  e.preventDefault();
  ask({ cmd: 'sidebar.resize' });
});
</script>
