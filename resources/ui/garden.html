<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Savanna</title>
<link rel="stylesheet" href="roar.css">
<!-- Easter egg: the GitHub contribution calendar as a savanna. Opened by Option-click or
     triple-click on the sidebar's GitHub icon, or its right-click menu. Data: garden.data. -->
<style>
:root {
  --earth: #ecd3ab; --earth-2: #dcb98b; --short: #bccb6c; --tall: #93ab45; --blade: #6f8a2c;
  --canopy: #5f7f2f; --canopy-2: #7b9a3d; --trunk: #7a5a40; --water: #6db5c8; --water-2: #b9e3ec;
  --sky-day: #ffeacb; --sky-dusk: #ffc39a; --sky-night: #3a2b4a; --sun: #ffb43a; --moon: #fff3d6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --earth: #3b2a1b; --earth-2: #4a3522; --short: #66752f; --tall: #7f9437; --blade: #a5ba51;
    --canopy: #9bb44a; --canopy-2: #b9cf62; --trunk: #c09a72; --water: #3f93ab; --water-2: #8fd0e0;
    --sky-day: #3a2a1a; --sky-dusk: #4a2a22; --sky-night: #161022; --sun: #ff9a2e; --moon: #fbeedd;
  }
}
body { background: var(--panel); overflow-x: hidden; }
main { max-width: 1040px; margin: 0 auto; padding: 44px 28px 72px; }
.eyebrow { display: inline-block; font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--mane-ink); background: var(--mane-soft); border-radius: 99px; padding: 3px 10px; font-weight: 600; }
h1 { margin: 12px 0 6px; font: 800 44px/1 var(--round); letter-spacing: -.025em; }
.stats { margin: 0; color: var(--ink-2); font-size: 14px; font-variant-numeric: tabular-nums; min-height: 1.4em; }
.stats b { color: var(--ink); font-weight: 650; }
.shell { margin-top: 28px; padding: 6px; border-radius: 26px; background: var(--ground); box-shadow: inset 0 0 0 1px var(--rule); }
.scene { position: relative; border-radius: 20px; overflow: hidden; background: var(--sky-day); }
.sky { position: absolute; inset: 0 0 auto; height: 120px; pointer-events: none; }
.sky .orb { position: absolute; left: 0; top: 0; width: 34px; height: 34px; border-radius: 50%; }
#sun { background: var(--sun); box-shadow: 0 0 0 8px color-mix(in srgb, var(--sun) 22%, transparent); }
#moon { background: var(--moon); box-shadow: inset -8px -3px 0 0 color-mix(in srgb, var(--sky-night) 30%, transparent); opacity: 0; }
#tint { position: absolute; inset: 0; z-index: -1; background: linear-gradient(var(--sky-night), transparent); opacity: 0; pointer-events: none; }
.sky { z-index: 0; isolation: isolate; height: 100% !important; }
.field { position: relative; padding: 96px 22px 22px; }
svg#grid { display: block; width: 100%; height: auto; overflow: visible; }
.tile .base { fill: var(--earth); }
.tile:hover .base { fill: var(--mane-soft); }
.crack { stroke: var(--earth-2); stroke-width: .9; fill: none; stroke-linecap: round; }
.tuft { stroke: var(--short); stroke-width: 1.4; fill: none; stroke-linecap: round; }
.t2 .base, .t3 .base, .t4 .base { fill: var(--short); }
.blade { stroke: var(--blade); stroke-width: 1.3; fill: none; stroke-linecap: round; transform-box: fill-box; transform-origin: 50% 100%; animation: sway 3.6s cubic-bezier(.45,.05,.35,1) infinite alternate; }
@keyframes sway { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
.trunk { stroke: var(--trunk); stroke-width: 1.4; fill: none; stroke-linecap: round; }
.canopy { fill: var(--canopy); } .canopy-2 { fill: var(--canopy-2); }
.pool { fill: var(--water); } .glint { fill: var(--water-2); animation: glint 2.8s ease-in-out infinite alternate; }
@keyframes glint { from { opacity: .35; } to { opacity: 1; } }
.empty .tile { opacity: .7; }
#animal { cursor: pointer; }
#animal .sprite { transform-box: fill-box; transform-origin: 50% 100%; }
.zzz { font: 700 7px var(--round); fill: var(--ink-2); opacity: 0; }
.roar-word { font: 900 11px var(--round); fill: var(--mane-ink); opacity: 0; letter-spacing: .02em; }
#tip { position: absolute; z-index: 2; pointer-events: none; transform: translate(-50%, calc(-100% - 10px)); background: var(--ink); color: var(--panel); font-size: 12px; padding: 6px 10px; border-radius: 9px; white-space: nowrap; font-variant-numeric: tabular-nums; box-shadow: var(--shadow); }
#tip b { font-weight: 650; }
.note { position: absolute; inset: 96px 0 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
.note p { margin: 0; padding: 12px 20px; border-radius: 14px; background: color-mix(in srgb, var(--panel) 86%, transparent); font: 650 16px var(--round); color: var(--ink); box-shadow: var(--shadow); }
.note small { display: block; margin-top: 4px; font: 12px var(--ui); color: var(--ink-3); }
.bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 16px; padding: 0 6px; }
.legend { display: flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 12px; margin-left: auto; }
.legend svg { width: 15px; height: 15px; }
.bar .label { color: var(--ink-3); font-size: 12px; }
.segmented button { transition: background .25s cubic-bezier(.32,.72,0,1), color .25s cubic-bezier(.32,.72,0,1); }
.segmented button:active { transform: scale(.97); }
@media (max-width: 640px) { main { padding: 28px 16px 48px; } h1 { font-size: 34px; } .field { padding: 84px 10px 12px; } .legend { margin-left: 0; } }
</style>
</head>
<body>
<main>
  <span class="eyebrow" id="who">Savanna</span>
  <h1>Savanna</h1>
  <p class="stats" id="stats" aria-live="polite">Walking out to the grasslands…</p>
  <div class="shell">
    <div class="scene" id="scene">
      <div class="sky" aria-hidden="true"><span class="orb" id="sun"></span><span class="orb" id="moon"></span><div id="tint"></div></div>
      <div class="field">
        <svg id="grid" role="img" aria-labelledby="stats"></svg>
      </div>
      <div class="note" id="note" hidden><p>Sign in to GitHub to grow your garden<small>Run <code>gh auth login</code>, then reopen Savanna.</small></p></div>
      <div id="tip" role="tooltip" hidden></div>
    </div>
  </div>
  <div class="bar">
    <span class="label" id="animal-label">Roaming</span>
    <div class="segmented" role="group" aria-labelledby="animal-label" id="picker"></div>
    <div class="legend" aria-hidden="true">Bare
      <svg viewBox="0 0 14 14" data-legend="0"></svg><svg viewBox="0 0 14 14" data-legend="1"></svg><svg viewBox="0 0 14 14" data-legend="2"></svg><svg viewBox="0 0 14 14" data-legend="3"></svg><svg viewBox="0 0 14 14" data-legend="4"></svg>
    Watering hole</div>
  </div>
</main>
<script src="bridge.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const T = 14, GAP = 3, P = T + GAP;  // Tile size and pitch, in grid units.
const SPRING = 'cubic-bezier(.32,.72,0,1)';

// Tile art per tier (GitHub's level 0-4): earth, short grass, tall grass, acacia, watering hole.
const TILE = [
  () => '<path class="crack" d="M3 9.5l2.5-1.2 1.5 1.4M9 4.5l1.6 1"/>',
  () => '<path class="tuft" d="M3.5 10.5l.4-2.6M4.6 10.5l1-2.2M9 8.5l.3-2.4M10 8.5l1-2"/>',
  () => '<path class="blade" d="M3 12.5c0-3 .6-5.5 1.5-8"/><path class="blade" style="animation-delay:-1.2s" d="M6.8 12.5c0-3.4.2-6 .2-9"/><path class="blade" style="animation-delay:-2.1s" d="M10.6 12.5c0-2.8-.4-5-1.2-7.5"/>',
  () => '<path class="trunk" d="M7 13V7.5M7 9l-2.2-2M7 8.5l2.4-2"/><ellipse class="canopy" cx="7" cy="5.2" rx="6" ry="2.4"/><ellipse class="canopy-2" cx="6" cy="4.4" rx="3.4" ry="1.2"/>',
  () => '<ellipse class="pool" cx="7" cy="8" rx="5.6" ry="3.6"/><ellipse class="glint" cx="5.4" cy="7" rx="2" ry=".7"/><path class="tuft" style="stroke:var(--blade)" d="M1.6 5l.3-2M12 5.5l.4-2"/>',
];
const tileSvg = (tier) => `<rect class="base" width="${T}" height="${T}" rx="3.5"/>${TILE[tier]()}`;

// Original sprites in the Roar mascot style: round flat shapes, cocoa outline, petal accents.
// Each faces right in a 40x34 box with its feet on y=32.
const O = 'stroke="#4A2E18" stroke-width="2" stroke-linejoin="round"';
const legs = (c, xs) => xs.map((x) => `<rect x="${x}" y="24" width="4" height="8" rx="2" fill="${c}" ${O}/>`).join('');
const eye = (x, y) => `<circle cx="${x}" cy="${y}" r="1.6" fill="#4A2E18"/>`;
const ANIMALS = {
  lion: { name: 'Lion', svg: `${legs('#FFC72C', [10, 24])}<path d="M8 20q-6-1-5-7" fill="none" ${O}/><circle cx="3" cy="12" r="2.2" fill="#FF7A00"/><ellipse cx="18" cy="21" rx="11" ry="6.5" fill="#FFC72C" ${O}/>
    <g>${[0, 1, 2, 3, 4, 5, 6, 7].map((i) => `<circle cx="${29 + 7.5 * Math.cos(i * Math.PI / 4)}" cy="${13 + 7.5 * Math.sin(i * Math.PI / 4)}" r="4.6" fill="${i % 2 ? '#FF9A2E' : '#FF7A00'}"/>`).join('')}</g>
    <circle cx="29" cy="13" r="6.6" fill="#FFC72C" ${O}/>${eye(27.4, 11.6)}${eye(31.6, 11.6)}<path d="M28.3 14.6h2.4l-1.2 1.4z" fill="#4A2E18"/>` },
  elephant: { name: 'Elephant', svg: `${legs('#B9A9C9', [9, 22])}<ellipse cx="17" cy="19" rx="12" ry="8" fill="#B9A9C9" ${O}/><ellipse cx="25" cy="13" rx="5" ry="7" fill="#D7CBE2" ${O}/>
    <circle cx="30" cy="13" r="6.5" fill="#B9A9C9" ${O}/><path d="M35 15q3 6 0 11" fill="none" stroke="#4A2E18" stroke-width="4.2" stroke-linecap="round"/><path d="M35 15q3 6 0 11" fill="none" stroke="#B9A9C9" stroke-width="2.2" stroke-linecap="round"/>${eye(31.5, 11.5)}<path d="M33 17.5l3 1.4" stroke="#FFF6EA" stroke-width="1.6" stroke-linecap="round"/>` },
  giraffe: { name: 'Giraffe', svg: `${legs('#FFC72C', [12, 22])}<path d="M27 20L31 5" stroke="#4A2E18" stroke-width="7" stroke-linecap="round"/><path d="M27 20L31 5" stroke="#FFC72C" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="19" cy="21" rx="10" ry="6" fill="#FFC72C" ${O}/><circle cx="15" cy="20" r="2" fill="#C8691A"/><circle cx="21" cy="18.5" r="1.6" fill="#C8691A"/><circle cx="23" cy="23" r="1.6" fill="#C8691A"/><circle cx="29" cy="13" r="1.2" fill="#C8691A"/>
    <path d="M30 2.5v-2M33 3v-2" stroke="#4A2E18" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="34" cy="5" rx="5" ry="3.4" fill="#FFC72C" ${O}/>${eye(34.5, 4)}` },
  zebra: { name: 'Zebra', svg: `${legs('#FFF6EA', [10, 23])}<path d="M8 19l-4 4" stroke="#4A2E18" stroke-width="2" stroke-linecap="round"/><ellipse cx="18" cy="20" rx="11" ry="6.5" fill="#FFF6EA" ${O}/>
    <path d="M14 14v12M19 13.5v13M24 14v11" stroke="#4A2E18" stroke-width="2"/><path d="M26 18l4-9" stroke="#4A2E18" stroke-width="6.5" stroke-linecap="round"/><path d="M26 18l4-9" stroke="#FFF6EA" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M27 7.5l3-3" stroke="#4A2E18" stroke-width="3" stroke-linecap="round"/><ellipse cx="33" cy="10" rx="5.5" ry="3.6" fill="#FFF6EA" ${O}/><path d="M36 12.5h2" stroke="#4A2E18" stroke-width="2.4" stroke-linecap="round"/>${eye(32.5, 9)}` },
  meerkat: { name: 'Meerkat', svg: `<path d="M17 30q-6 1-8-3" fill="none" ${O}/><ellipse cx="20" cy="22" rx="6" ry="10" fill="#E8B87A" ${O}/><ellipse cx="20" cy="24" rx="3.4" ry="6" fill="#FFE2B8"/>
    <rect x="15.5" y="27" width="4" height="5" rx="2" fill="#E8B87A" ${O}/><rect x="20.5" y="27" width="4" height="5" rx="2" fill="#E8B87A" ${O}/><path d="M17 17l-1 4M23 17l1 4" stroke="#4A2E18" stroke-width="1.8" stroke-linecap="round"/>
    <ellipse cx="21" cy="9.5" rx="5.4" ry="5" fill="#E8B87A" ${O}/><ellipse cx="22.4" cy="9" rx="1.8" ry="1.4" fill="#4A2E18"/><circle cx="26" cy="10.6" r="1" fill="#4A2E18"/><circle cx="17" cy="6.8" r="1.4" fill="#C08A50"/>` },
};
let animalKey = 'lion';
try { const k = localStorage.getItem('savanna.animal'); if (ANIMALS[k]) animalKey = k; } catch {}

function legend() {
  for (const s of document.querySelectorAll('[data-legend]')) { s.classList.add('tile', 't' + s.dataset.legend); s.innerHTML = tileSvg(+s.dataset.legend); }
}

// Days arrive as {d:'YYYY-MM-DD', c:count, l:level}; keep the last 52 weeks.
function weeks(days) {
  const last = days.length ? new Date(days[days.length - 1].d + 'T12:00') : new Date();
  const start = new Date(last); start.setDate(start.getDate() - (51 * 7 + last.getDay()));
  const byDate = new Map(days.map((x) => [x.d, x]));
  const out = [];
  for (let d = new Date(start), i = 0; d <= last; d.setDate(d.getDate() + 1), i++) {
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const x = byDate.get(key) || { d: key, c: 0, l: 0 };
    out.push({ ...x, col: Math.floor(i / 7), row: d.getDay(), tier: Math.max(0, Math.min(4, x.l | 0)) });
  }
  return out;
}

function stats(cells) {
  let total = 0, run = 0, best = 0, busiest = cells[0];
  for (const c of cells) {
    total += c.c;
    run = c.c > 0 ? run + 1 : 0;
    best = Math.max(best, run);
    if (c.c > busiest.c) busiest = c;
  }
  return { total, best, busiest };
}
const fmt = (d) => new Date(d + 'T12:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
const plural = (n, w) => `${n.toLocaleString()} ${w}${n === 1 ? '' : 's'}`;

let cells = [], busiest = null;
function draw(empty) {
  const g = $('grid');
  const cols = cells.length ? cells[cells.length - 1].col + 1 : 52;
  g.setAttribute('viewBox', `-2 -14 ${cols * P + 2} ${7 * P + 16}`);
  g.innerHTML = cells.map((c, i) =>
    `<g class="tile t${c.tier}" data-i="${i}" data-tier="${c.tier}" transform="translate(${c.col * P} ${c.row * P})">${tileSvg(c.tier)}</g>`).join('') +
    `<g id="animal" role="button" tabindex="0" aria-label="${ANIMALS[animalKey].name}. Click to roar."><g class="sprite">${ANIMALS[animalKey].svg}</g>
     <text class="zzz" x="30" y="2">z</text><text class="roar-word" x="22" y="-4">ROAR!</text></g>`;
  $('scene').classList.toggle('empty', !!empty);
}

// The animal: 26 grid units tall, standing on a tile's lower edge.
const SCALE = 26 / 34;
let pos = { x: 0, y: 0 }, facing = 1, walking = null, napping = false;
const place = (c) => ({ x: c.col * P + T / 2 - 20 * SCALE, y: c.row * P + T - 32 * SCALE });
function setAnimal(p, f) {
  const a = $('animal'); if (!a) return;
  a.setAttribute('transform', `translate(${p.x} ${p.y}) scale(${SCALE})`);
  a.querySelector('.sprite').setAttribute('transform', f < 0 ? 'translate(40 0) scale(-1 1)' : '');
}
function walkTo(c) {
  const to = place(c), from = { ...pos };
  facing = to.x === from.x ? facing : to.x > from.x ? 1 : -1;
  setAnimal(from, facing);
  const sprite = $('animal').querySelector('.sprite');
  const dist = Math.hypot(to.x - from.x, to.y - from.y), ms = Math.max(600, dist * 45);
  const t0 = performance.now();
  const hop = sprite.animate([{ translate: '0 0' }, { translate: '0 -2px' }, { translate: '0 0' }], { duration: 260, iterations: Math.ceil(ms / 260) });
  return new Promise((done) => {
    const step = (now) => {
      const k = Math.min(1, (now - t0) / ms), e = k * k * (3 - 2 * k);  // Smoothstep: ease in and out.
      pos = { x: from.x + (to.x - from.x) * e, y: from.y + (to.y - from.y) * e };
      setAnimal(pos, facing);
      if (k < 1 && walking === step) requestAnimationFrame(step); else { hop.cancel(); done(); }
    };
    walking = step; requestAnimationFrame(step);
  });
}
function nap(on) {
  napping = on;
  const z = $('animal')?.querySelector('.zzz'); if (!z) return;
  z.getAnimations().forEach((a) => a.cancel());
  if (on && !reduce) z.animate([{ opacity: 0, transform: 'translate(0,4px)' }, { opacity: 1 }, { opacity: 0, transform: 'translate(4px,-6px)' }], { duration: 2200, iterations: Infinity });
  else z.style.opacity = on ? 1 : 0;
}
async function roam() {
  // A few wanders across the grid, then a nap on the busiest day; repeat.
  for (;;) {
    nap(false);
    for (let n = 0; n < 4 + Math.floor(Math.random() * 3); n++) {
      const here = cells.reduce((b, c) => Math.hypot(place(c).x - pos.x, place(c).y - pos.y) < Math.hypot(place(b).x - pos.x, place(b).y - pos.y) ? c : b, cells[0]);
      const near = cells.filter((c) => Math.abs(c.col - here.col) <= 4 && Math.abs(c.row - here.row) <= 3 && c !== here);
      await walkTo(near[Math.floor(Math.random() * near.length)]);
      await new Promise((r) => setTimeout(r, 500 + Math.random() * 1400));
    }
    await walkTo(busiest);
    nap(true);
    await new Promise((r) => setTimeout(r, 9000));
  }
}
function roar() {
  const a = $('animal'); if (!a) return;
  const sprite = a.querySelector('.sprite'), word = a.querySelector('.roar-word');
  if (reduce) { word.style.opacity = 1; setTimeout(() => (word.style.opacity = 0), 1200); return; }
  sprite.animate([{ scale: '1' }, { scale: '1.25 .85', offset: .2 }, { scale: '.92 1.12', offset: .45 }, { scale: '1' }], { duration: 700, easing: SPRING });
  word.animate([{ opacity: 0, transform: 'translate(0,6px) scale(.6)' }, { opacity: 1, transform: 'translate(0,0) scale(1.15)', offset: .25 }, { opacity: 1, offset: .75 }, { opacity: 0, transform: 'translate(0,-8px) scale(1)' }], { duration: 1300, easing: SPRING });
}

function picker() {
  $('picker').innerHTML = Object.entries(ANIMALS).map(([k, a]) => `<button data-animal="${k}" aria-pressed="${k === animalKey}">${a.name}</button>`).join('');
  $('picker').onclick = (e) => {
    const b = e.target.closest('[data-animal]'); if (!b) return;
    animalKey = b.dataset.animal;
    try { localStorage.setItem('savanna.animal', animalKey); } catch {}
    for (const x of $('picker').children) x.setAttribute('aria-pressed', x === b);
    const a = $('animal'); a.querySelector('.sprite').innerHTML = ANIMALS[animalKey].svg; a.setAttribute('aria-label', `${ANIMALS[animalKey].name}. Click to roar.`);
    nap(napping);
    roar();
  };
}

// Day and night: one slow loop (or the real hour, standing still, when motion is reduced).
function sky() {
  const sun = $('sun'), moon = $('moon'), tint = $('tint'), w = () => $('scene').clientWidth;
  const at = (k) => {  // k: 0..1 around the clock, 0 = dawn
    const day = k < .5, t = (day ? k : k - .5) * 2;
    const x = 30 + t * (w() - 94), y = 70 - Math.sin(t * Math.PI) * 52;
    (day ? sun : moon).style.transform = `translate(${x}px, ${y}px)`;
    sun.style.opacity = day ? 1 : 0; moon.style.opacity = day ? 0 : 1;
    const dusk = Math.max(0, 1 - Math.min(Math.abs(k - .5), Math.abs(k), Math.abs(1 - k)) * 10);
    tint.style.opacity = day ? dusk * .18 : .28 + Math.sin(t * Math.PI) * .2;
  };
  if (reduce) { const h = new Date().getHours() + new Date().getMinutes() / 60; return at((((h - 6) / 24) % 1 + 1) % 1); }
  const t0 = performance.now(), LOOP = 120000, off = (((new Date().getHours() - 6) / 24) % 1 + 1) % 1;
  const tick = (now) => { at((off + (now - t0) / LOOP) % 1); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}

function tooltips() {
  const tip = $('tip'), scene = $('scene');
  $('grid').addEventListener('mousemove', (e) => {
    const t = e.target.closest('.tile'); if (!t || !cells.length || scene.classList.contains('empty')) return (tip.hidden = true);
    const c = cells[+t.dataset.i], r = t.getBoundingClientRect(), s = scene.getBoundingClientRect();
    tip.innerHTML = `<b>${c.c ? plural(c.c, 'contribution') : 'No contributions'}</b> · ${esc(fmt(c.d))}`;
    tip.style.left = (r.left + r.width / 2 - s.left) + 'px'; tip.style.top = (r.top - s.top) + 'px';
    tip.hidden = false;
  });
  $('grid').addEventListener('mouseleave', () => (tip.hidden = true));
}

async function start() {
  legend(); picker(); sky(); tooltips();
  let data = null;
  try { data = await ask({ cmd: 'garden.data' }); } catch {}
  const ok = data && Array.isArray(data.days) && data.days.length;
  cells = weeks(ok ? data.days.filter((x) => /^\d{4}-\d\d-\d\d$/.test(x.d)) : []);
  if (!ok) cells.forEach((c) => (c.c = 0, c.tier = 0));
  draw(!ok);
  $('note').hidden = !!ok;
  const s = stats(cells);
  busiest = s.busiest;
  if (ok) {
    $('who').textContent = '@' + data.login + ' · last 52 weeks';
    $('stats').innerHTML = `<b>${plural(s.total, 'contribution')}</b> · longest streak <b>${plural(s.best, 'day')}</b> · busiest <b>${esc(fmt(s.busiest.d))}</b> (${s.busiest.c.toLocaleString()})`;
  } else {
    $('who').textContent = 'Not signed in';
    $('stats').textContent = 'An empty savanna, waiting for rain.';
    busiest = cells[Math.floor(cells.length / 2)];
  }
  const a = $('animal');
  a.onclick = roar;
  a.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); roar(); } };
  pos = place(reduce ? busiest : cells[Math.floor(Math.random() * cells.length)]);
  setAnimal(pos, 1);
  if (reduce) nap(true); else roam();
}
start();
</script>
</body>
</html>
