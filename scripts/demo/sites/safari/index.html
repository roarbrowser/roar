<!doctype html>
<!-- Fictional travel site for the safari demo. Made-up company, made-up prices, no third-party assets; nothing is booked. -->
<meta charset="utf-8"><title>Lionfold Journeys (demo site)</title>
<style>
:root{--ink:#1f2a1c;--muted:#5d6b57;--line:#dfe5d6;--bg:#f7f5ee;--brand:#2f6b3a;--sun:#e8a33c}
*{margin:0;box-sizing:border-box}
body{font-family:-apple-system,"Helvetica Neue",sans-serif;color:var(--ink);background:var(--bg);font-size:18px}
header{display:flex;align-items:center;gap:14px;padding:18px 48px;background:#fff;border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#5f9a4a);display:grid;place-items:center;color:#fff;font-weight:900}
header b{font-size:22px}header nav{margin-left:auto;display:flex;gap:28px;color:var(--muted)}
.demo{font-size:13px;color:#a33;border:1px solid #e6b5b5;padding:2px 8px;border-radius:6px;margin-left:12px}
.hero{height:330px;position:relative;overflow:hidden;background:linear-gradient(#f6c27a,#e88d4a 55%,#b85c2b)}
.hero .sun{position:absolute;left:62%;top:60px;width:160px;height:160px;border-radius:50%;background:#ffe7a8;box-shadow:0 0 80px #ffd27a}
.hero svg{position:absolute;bottom:0;width:100%;height:180px}
.hero h1{position:absolute;left:48px;top:70px;color:#fff;font-size:54px;letter-spacing:-.02em;text-shadow:0 3px 20px rgba(0,0,0,.25);max-width:620px}
.search{margin:-50px 48px 0;position:relative;background:#fff;border-radius:18px;box-shadow:0 20px 50px rgba(30,40,20,.15);padding:22px;display:flex;gap:14px;align-items:end}
.f{flex:1}.f label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
input,select{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(47,107,58,.15)}
.btn{font:700 18px inherit;font-family:inherit;padding:14px 28px;border:0;border-radius:10px;background:var(--brand);color:#fff;cursor:pointer;white-space:nowrap}
.btn.alt{background:var(--sun);color:#2a1a05}
section{padding:34px 48px}
h2{font-size:28px;margin-bottom:18px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{background:#fff;border:2px solid var(--line);border-radius:16px;overflow:hidden;transition:border-color .3s,transform .3s,box-shadow .3s}
.card.hl{border-color:var(--sun);transform:translateY(-6px);box-shadow:0 18px 40px rgba(120,80,20,.18)}
.pic{height:150px;position:relative}
.card .body{padding:18px}.card h3{font-size:21px}.card p{color:var(--muted);margin:6px 0 12px;font-size:16px}
.price{font-size:26px;font-weight:800}.price small{font-size:14px;color:var(--muted);font-weight:500}
.tag{display:inline-block;font-size:13px;background:#eaf3e4;color:var(--brand);padding:3px 10px;border-radius:99px;margin-right:6px}
.hide{display:none}
.form{background:#fff;border-radius:16px;padding:26px;display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1100px}
.summary{background:#fff;border-radius:16px;padding:26px;max-width:1100px;margin-top:20px;display:flex;justify-content:space-between;align-items:center}
.done{max-width:900px;margin:40px auto;text-align:center;background:#fff;border-radius:20px;padding:50px}
.done .check{width:90px;height:90px;border-radius:50%;background:var(--brand);color:#fff;font-size:54px;display:grid;place-items:center;margin:0 auto 18px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0)}}
.code{font:700 28px ui-monospace,monospace;letter-spacing:.1em;margin-top:14px;color:var(--brand)}
</style>
<header><div class="logo">LJ</div><b>Lionfold Journeys</b><span class="demo">Demo site · fictional</span><nav><span>Trips</span><span>Lodges</span><span>Help</span></nav></header>
<div id="home">
  <div class="hero"><div class="sun"></div><h1>Small-group safaris across East Africa</h1>
    <svg viewBox="0 0 1200 180" preserveAspectRatio="none"><path d="M0 90 Q300 40 600 80 T1200 60 V180 H0Z" fill="#7a4a22"/><g fill="#2b1a0c"><rect x="240" y="20" width="8" height="70"/><ellipse cx="244" cy="22" rx="80" ry="15"/><rect x="900" y="30" width="7" height="55"/><ellipse cx="903" cy="32" rx="60" ry="12"/></g></svg></div>
  <form class="search" onsubmit="event.preventDefault();search()">
    <div class="f"><label>Where</label><input id="where" placeholder="Country or park"></div>
    <div class="f"><label>When</label><input id="when" placeholder="Month"></div>
    <div class="f"><label>Travellers</label><input id="who" placeholder="Adults"></div>
    <div class="f"><label>Budget</label><input id="budget" placeholder="Max total"></div>
    <button class="btn" id="go">Search trips</button>
  </form>
</div>
<section id="results" class="hide">
  <h2 id="rh">Trips</h2>
  <div class="cards" id="cards"></div>
</section>
<section id="book" class="hide">
  <h2>Who's travelling?</h2>
  <div class="form">
    <div class="f"><label>Lead traveller</label><input id="name"></div>
    <div class="f"><label>Email</label><input id="email"></div>
    <div class="f"><label>Second traveller</label><input id="name2"></div>
    <div class="f"><label>Room</label><select id="room"><option>Twin</option><option>Double</option></select></div>
  </div>
  <div class="summary"><div><div id="sumTrip" style="font-weight:800;font-size:22px"></div><div id="sumMeta" style="color:var(--muted)"></div></div><div style="text-align:right"><div class="price" id="sumPrice"></div><button class="btn alt" id="confirm" onclick="confirmTrip()" style="margin-top:10px">Confirm booking</button></div></div>
</section>
<section id="confirmed" class="hide"><div class="done"><div class="check">✓</div><h2>You're going on safari</h2><div id="doneText" style="color:var(--muted)"></div><div class="code">LJ-48217</div></div></section>
<script>
const TRIPS = [
  { id: 'mara', name: 'Maasai Mara Explorer', days: 5, where: 'Kenya', price: 3480, tags: ['Great Migration', 'Tented camp'], sky: ['#f6c27a', '#c9702f'] },
  { id: 'amboseli', name: 'Amboseli & Kilimanjaro Views', days: 4, where: 'Kenya', price: 2960, tags: ['Elephants', 'Lodge'], sky: ['#a9cbe0', '#d9a066'] },
  { id: 'samburu', name: 'Samburu Wild North', days: 6, where: 'Kenya', price: 4390, tags: ['Remote', 'Bush walks'], sky: ['#f2a65a', '#8a3d1f'] },
];
const $ = (s) => document.querySelector(s);
const show = (id) => ['home', 'results', 'book', 'confirmed'].forEach((x) => $('#' + x).classList.toggle('hide', x !== id && !(id === 'results' && x === 'home')));
const money = (n) => '$' + n.toLocaleString('en-US');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
// Types like a person, so the screencast shows each field filling in.
window.typeInto = async (sel, text, ms = 55) => { const e = $(sel); e.focus(); e.scrollIntoView({ block: 'center', behavior: 'smooth' }); e.value = ''; for (const c of text) { e.value += c; await sleep(ms); } e.blur(); };
window.search = () => {
  $('#rh').textContent = `${TRIPS.length} trips in ${$('#where').value || 'East Africa'} · ${$('#when').value} · ${$('#who').value} travellers`;
  $('#cards').innerHTML = TRIPS.map((t) => `<div class="card" id="c-${t.id}"><div class="pic" style="background:linear-gradient(${t.sky[0]},${t.sky[1]})"><svg viewBox="0 0 400 150" preserveAspectRatio="none" style="position:absolute;bottom:0;width:100%;height:80px"><path d="M0 60 Q120 20 220 50 T400 40 V150 H0Z" fill="#3a2414"/></svg></div><div class="body"><h3>${t.name}</h3><p>${t.days} days · ${t.where}</p>${t.tags.map((x) => `<span class="tag">${x}</span>`).join('')}<div class="price" style="margin-top:12px">${money(t.price)} <small>for 2</small></div></div></div>`).join('');
  show('results'); $('#results').scrollIntoView({ behavior: 'smooth' });
  return TRIPS.map((t) => `${t.name}: ${t.days} days, ${money(t.price)} for 2`).join('\n');
};
window.highlight = (id) => { document.querySelectorAll('.card').forEach((c) => c.classList.toggle('hl', c.id === 'c-' + id)); };
window.choose = (id) => {
  const t = TRIPS.find((x) => x.id === id); window.trip = t;
  $('#sumTrip').textContent = t.name; $('#sumMeta').textContent = `${t.days} days · ${$('#when').value || 'September'} · 2 travellers`; $('#sumPrice').textContent = money(t.price);
  show('book'); window.scrollTo({ top: 0, behavior: 'smooth' });
};
window.confirmTrip = () => { $('#doneText').textContent = `${trip.name}, ${$('#when').value || 'September'}, 2 travellers, ${money(trip.price)}. Confirmation sent to ${$('#email').value}.`; show('confirmed'); return 'LJ-48217'; };
</script>
